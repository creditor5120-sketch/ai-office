name: SW AI OFFICE - 무료 자동 개발 에이전트

on:
  push:
    branches: [main]
    paths:
      - "automation/ai-autopilot.mjs"
      - ".github/workflows/sw-ai-office-autopilot.yml"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sw-ai-office-autopilot
  cancel-in-progress: false

jobs:
  ai-maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gemini 자동 점검 및 수정안 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_FALLBACK_MODELS: gemini-3.8-flash
        run: node automation/ai-autopilot.mjs

      - name: 수정안 적용 및 변경 여부 확인
        id: patch
        shell: bash
        run: |
          if [ ! -f ai-autopilot.patch ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git apply --check ai-autopilot.patch
          git apply ai-autopilot.patch
          git diff --check
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 브라우저 테스트 준비
        if: steps.patch.outputs.changed == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: 전체 회귀 테스트
        if: steps.patch.outputs.changed == 'true'
        run: |
          node --test tests/*.test.mjs
          node tests/v315-office-browser-smoke.mjs
          node tests/v7-dance-time-browser-smoke.mjs

      - name: 변경사항 커밋 및 PR 생성
        if: steps.patch.outputs.changed == 'true'
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BRANCH="autopilot/ai-maintenance-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- office-v315-integrated.html workflow-bridge-latest.js tests/v315-workflow-bridge.test.mjs tests/v315-office-browser-smoke.mjs ai-autopilot-report.md
          git commit -m "chore: SW AI OFFICE autonomous maintenance"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "SW AI OFFICE 자동 개발 개선" \
            --body-file ai-autopilot-report.md)
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: 테스트 통과 변경사항 자동 병합
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.proposal.outputs.url }}" --squash --delete-branch

      - name: 수정안이 없을 때 점검 보고서 보관
        if: steps.patch.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sw-ai-office-autopilot-report
          path: ai-autopilot-report.md
          if-no-files-found: error
