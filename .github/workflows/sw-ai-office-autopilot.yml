name: SW AI OFFICE - 무료 자동 개발 에이전트

on:
  push:
    branches: [main]
    paths:
      - "automation/ai-autopilot.mjs"
      - ".github/workflows/sw-ai-office-autopilot.yml"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sw-ai-office-autopilot
  cancel-in-progress: false

jobs:
  ai-maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gemini 자동 점검 및 수정안 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODELS: ""
        run: node automation/ai-autopilot.mjs

      - name: 수정안 적용 및 변경 여부 확인
        id: patch
        shell: bash
        run: |
          if [ ! -f ai-autopilot.patch ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "수정안 없음: 다음 자동 회차에서 계속 점검합니다."
            exit 0
          fi
          if ! git apply --recount --check ai-autopilot.patch; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "## 자동 적용 보류"
              echo ""
              echo "AI가 생성한 수정안의 문맥이 현재 소스와 일치하지 않아 안전하게 적용하지 않았습니다."
            } >> ai-autopilot-report.md
            echo "AI 수정안이 현재 코드와 맞지 않아 안전하게 건너뛰었습니다."
            exit 0
          fi
          git apply --recount ai-autopilot.patch
          git diff --check
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 브라우저 테스트 준비
        if: steps.patch.outputs.changed == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: 전체 회귀 테스트
        if: steps.patch.outputs.changed == 'true'
        run: |
          node --test tests/*.test.mjs
          node tests/office3d-smoke.mjs

      - name: 테스트 통과 변경사항을 main에 자동 반영
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- office3d.html office-map.html tests/office3d-smoke.mjs tests/office3d-entrypoint.test.mjs ai-autopilot-report.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "검증할 변경사항이 없어 반영을 생략합니다."
            exit 0
          fi
          git commit -m "chore: SW AI OFFICE autonomous maintenance"
          # 개발 중 main에 다른 변경이 먼저 반영되면 최신 main 위로 안전하게 재배치한다.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: 다음 자동 개발 회차 예약 (일시 오류가 있어도 계속)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "다음 회차를 위해 5분 대기합니다."
          sleep 300
          gh workflow run sw-ai-office-autopilot.yml --ref main

      - name: 수정안이 없을 때 점검 보고서 보관
        if: steps.patch.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sw-ai-office-autopilot-report
          path: ai-autopilot-report.md
          if-no-files-found: error
