name: SW AI OFFICE - 무료 자동 개발 에이전트

on:
  push:
    branches: [main]
    paths:
      - "automation/ai-autopilot.mjs"
      - ".github/workflows/sw-ai-office-autopilot.yml"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sw-ai-office-autopilot
  cancel-in-progress: false

jobs:
  ai-maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gemini 자동 점검 및 수정안 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODELS: ""
        run: node automation/ai-autopilot.mjs

      - name: 수정안 적용 및 변경 여부 확인
        id: patch
        shell: bash
        run: |
          if [ ! -f ai-autopilot.patch ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git apply --recount --check ai-autopilot.patch
          git apply --recount ai-autopilot.patch
          git diff --check
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 브라우저 테스트 준비
        if: steps.patch.outputs.changed == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: 전체 회귀 테스트
        if: steps.patch.outputs.changed == 'true'
        run: |
          node --test tests/*.test.mjs
          node tests/office3d-smoke.mjs

      - name: 테스트 통과 변경사항을 main에 자동 반영
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- office3d.html office-map.html tests/office3d-smoke.mjs tests/office3d-entrypoint.test.mjs ai-autopilot-report.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "검증할 변경사항이 없어 반영을 생략합니다."
            exit 0
          fi
          git commit -m "chore: SW AI OFFICE autonomous maintenance"
          git push origin HEAD:main

      - name: 다음 자동 개발 회차 즉시 예약
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sw-ai-office-autopilot.yml --ref main

      - name: 수정안이 없을 때 점검 보고서 보관
        if: steps.patch.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sw-ai-office-autopilot-report
          path: ai-autopilot-report.md
          if-no-files-found: error
