<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SW AI OFFICE - Staging 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;max-width:960px;margin-inline:auto;background:#101827;color:#fff;font-family:Arial,sans-serif}h1{color:#60a5fa}.card{background:#243247;padding:20px;margin:14px 0;border-radius:12px}label{display:block;margin:12px 0 6px;font-weight:700}input,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #64748b;font:inherit}textarea{min-height:140px}button{width:100%;min-height:46px;margin-top:12px;padding:12px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer}button:disabled{opacity:.55}.small{color:#cbd5e1;font-size:14px;line-height:1.6}#result{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
</style>
</head>
<body>
<h1>SW AI OFFICE</h1>
<div class="card">
<h2>staging 전용 업무 테스트</h2>
<p class="small">이 페이지는 staging Worker만 호출합니다. 운영 Worker 주소는 사용하지 않습니다. 인증 토큰은 요청에만 사용하고 브라우저 저장소에 저장하지 않습니다.</p>
<label for="token">staging 인증 토큰</label>
<input id="token" type="password" autocomplete="off" placeholder="Cloudflare의 OFFICE_ACCESS_TOKEN 값">
<label for="task">테스트 업무 지시</label>
<textarea id="task" placeholder="예: 계약 검토 업무를 적절한 전문 직원에게 배정하고 팀장 검수 및 본부장 보고까지 진행해. 실제 외부 실행은 하지 마."></textarea>
<button id="send" type="button">staging에 업무 지시 보내기</button>
</div>
<div class="card"><h3>staging 응답</h3><div id="result">아직 테스트를 실행하지 않았습니다.</div></div>
<script type="module">
import employeeDirectory from './employees.js';
const STAGING_ENDPOINT='https://sweet-bush-c87eai-office-api-v51-staging.creditor5120.workers.dev/';
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
$('send').addEventListener('click',async()=>{
 const token=$('token').value.trim(),task=$('task').value.trim();
 if(!token){$('result').textContent='staging 인증 토큰을 입력해 주세요.';return;}
 if(!task){$('result').textContent='테스트 업무 지시를 입력해 주세요.';return;}
 if(!Array.isArray(employeeDirectory)||!employeeDirectory.some(e=>e.id==='COO')){$('result').textContent='employees.js에서 본부장(COO) 데이터를 찾지 못했습니다.';return;}
 const button=$('send');button.disabled=true;
 const taskId=crypto.randomUUID();
 const payload={task,taskId,idempotencyKey:taskId,employees:employeeDirectory};
 try{
  for(let step=1;step<=80;step++){
   $('result').textContent=`업무 처리 중 (${step}/80)
같은 업무 ID로 저장된 결과를 이어서 처리하고 있습니다.`;
   const response=await fetch(STAGING_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(payload)});
   const raw=await response.text();let data;try{data=JSON.parse(raw);}catch{data={responseText:raw};}
   if(data.status==='COMPLETED'||data.status==='PARTIAL_COMPLETED'){
    $('result').textContent=`HTTP ${response.status}\n\n${JSON.stringify(data,null,2)}`;return;
   }
   if(response.status===202&&data.status==='PROCESSING'){
    $('result').textContent=`업무 처리 중 (${step}/80)
현재 단계: ${data.currentStage||'확인 중'}
저장된 AI 결과: ${data.cachedAiCallCount??0}건
다음 처리 단위로 자동 연결합니다.`;
    await sleep(1200);continue;
   }
   if(response.status===409&&data.status==='PROCESSING'){
    $('result').textContent=`기존 실행이 끝나기를 기다리는 중 (${step}/80)
${JSON.stringify(data,null,2)}`;
    await sleep(2500);continue;
   }
   $('result').textContent=`HTTP ${response.status}\n\n${JSON.stringify(data,null,2)}`;return;
  }
  $('result').textContent='80회 처리 단위에 도달했습니다. 업무 기록은 서버에 남아 있습니다. 동일한 업무를 새로 만들지 말고 진행 상태를 확인해야 합니다.';
 }catch(error){$('result').textContent=`요청 실패: ${error.message}\n\n서버에 저장된 업무는 유지될 수 있습니다. 같은 업무를 새로 접수하지 마세요.`;}
 finally{$('token').value='';button.disabled=false;}
});
</script>
</body>
</html>
