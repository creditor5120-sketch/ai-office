<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SW AI OFFICE - Staging 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;max-width:960px;margin-inline:auto;background:#101827;color:#fff;font-family:Arial,sans-serif}h1{color:#60a5fa}.card{background:#243247;padding:20px;margin:14px 0;border-radius:12px}label{display:block;margin:12px 0 6px;font-weight:700}input,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #64748b;font:inherit}textarea{min-height:140px}button{width:100%;min-height:46px;margin-top:12px;padding:12px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer}button:disabled{opacity:.55}.small{color:#cbd5e1;font-size:14px;line-height:1.6}#result{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
</style>
</head>
<body>
<h1>SW AI OFFICE</h1>
<div class="card">
<h2>staging 전용 업무 테스트</h2>
<p class="small">이 페이지는 staging Worker만 호출합니다. 운영 Worker 주소는 사용하지 않습니다. 인증 토큰은 요청에만 사용하고 브라우저 저장소에 저장하지 않습니다.</p>
<label for="token">staging 인증 토큰</label>
<input id="token" type="password" autocomplete="off" placeholder="Cloudflare의 OFFICE_ACCESS_TOKEN 값">
<label for="resumeTaskId">보존된 기존 업무 ID (자동 연결)</label>
<input id="resumeTaskId" type="text" autocomplete="off" readonly placeholder="보존된 업무가 있으면 자동 표시됩니다.">
<p class="small" id="employeeSyncNote">직원별 배정 정보 확인 전</p>
<p class="small" id="pendingNote">기존 업무가 저장되어 있으면 업무 지시와 ID를 자동으로 불러옵니다.</p>
<label for="task">테스트 업무 지시</label>
<textarea id="task" placeholder="예: 계약 검토 업무를 적절한 전문 직원에게 배정하고 팀장 검수 및 본부장 보고까지 진행해. 실제 외부 실행은 하지 마."></textarea>
<button id="send" type="button">staging에 업무 지시 보내기</button>
</div>
<div class="card"><h3>staging 응답</h3><div id="result">아직 테스트를 실행하지 않았습니다.</div></div>
<script type="module">
import employeeDirectory from './employees.js';
const STAGING_ENDPOINT='https://sweet-bush-c87eai-office-api-v51-staging.creditor5120.workers.dev/';
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const pendingKey='swAIOfficeStagingPendingTask';
const quotaRetryKey='swAIOfficeStagingQuotaRetries';
const employeeStateKey='swAIOfficeEmployeeStates';
const MAX_QUOTA_RETRIES=288;
function readQuotaRetryCount(taskId){let saved=null;try{saved=JSON.parse(localStorage.getItem(quotaRetryKey)||'null')}catch{}return saved&&saved.taskId===taskId?Math.max(0,Number(saved.count)||0):0;}
function saveQuotaRetryCount(taskId,count){localStorage.setItem(quotaRetryKey,JSON.stringify({taskId,count,updatedAt:new Date().toISOString()}));}
function setHeadState(status,detail){
 let states={};try{states=JSON.parse(localStorage.getItem(employeeStateKey)||'{}')}catch{}
 states.COO={status,detail,updatedAt:new Date().toISOString(),source:'staging-response'};
 localStorage.setItem(employeeStateKey,JSON.stringify(states));
}
function setStagingEmployeesIdle(detail,taskId){
 let states={};try{states=JSON.parse(localStorage.getItem(employeeStateKey)||'{}')}catch{}
 const now=new Date().toISOString();
 for(const employee of employeeDirectory){
  const current=states[employee.id];
  if(current&&current.source==='staging-response'){
   states[employee.id]={...current,status:'대기',detail,taskId:taskId||current.taskId,updatedAt:now,source:'staging-response'};
  }
 }
 localStorage.setItem(employeeStateKey,JSON.stringify(states));
}
const employeeById=new Map(employeeDirectory.map(e=>[String(e.id),e]));
const employeeByName=new Map(employeeDirectory.map(e=>[String(e.name),e]));
function normalizeEmployeeStatus(value,stage){
 const raw=String(value||stage||'').toLowerCase();
 if(/승인|approved/.test(raw))return '검수 승인';
 if(/완료|complete|done/.test(raw))return '업무 완료';
 if(/검수|review|inspect|qa/.test(raw))return '검수 중';
 if(/협업|collab|coordinate|meeting/.test(raw))return '협업 중';
 if(/휴식|break|休/.test(raw))return '휴식 중';
 if(/대기|pending|idle/.test(raw))return '대기';
 return '업무 중';
}
function syncEmployeeStates(data,taskId){
 if(!data||typeof data!=='object')return {count:0,employees:[]};
 let states={};try{states=JSON.parse(localStorage.getItem(employeeStateKey)||'{}')}catch{}
 const stage=data.currentStage||data.workflow?.currentStage||'업무 처리';
 const seen=new Set();
 const visited=new Set();
 function applyEmployee(employee,value,role='담당'){
  if(!employee)return;
  const rawStatus=value.judgment??value.status??value.state??value.currentStatus??value.taskStatus??value.stageStatus??stage;
  const normalized=normalizeEmployeeStatus(rawStatus,stage);
  const detail=value.detail??value.description??value.task??value.instruction??value.currentTask??(role==='팀장'?'팀장 검수 및 협업':stage);
  states[employee.id]={status:role==='팀장'&&normalized==='업무 완료'?'검수 완료':normalized,detail:String(detail).slice(0,500),taskId,updatedAt:new Date().toISOString(),source:'staging-response'};
  seen.add(employee.id);
 }
 function walk(value,depth=0){
  if(!value||typeof value!=='object'||depth>9||visited.has(value))return;
  visited.add(value);
  if(Array.isArray(value)){value.forEach(item=>walk(item,depth+1));return;}
  const id=value.employeeId??value.assigneeId??value.assignedEmployeeId??value.workerId??value.staffId??(employeeById.has(String(value.id??''))?value.id:null);
  const name=value.employeeName??value.assigneeName??value.staffName??value.title??((value.department||value.position)?value.name:null)??(typeof value.employee==='string'?value.employee:null)??(typeof value.assignee==='string'?value.assignee:null);
  const employee=(id!=null&&employeeById.get(String(id)))||(name&&employeeByName.get(String(name)));
  applyEmployee(employee,value);
  const leaderName=typeof value.teamLeader==='string'?value.teamLeader:value.teamLeader?.name;
  if(leaderName)applyEmployee(employeeByName.get(String(leaderName)),value,'팀장');
  Object.values(value).forEach(child=>walk(child,depth+1));
 }
 walk(data);
 if(seen.size)localStorage.setItem(employeeStateKey,JSON.stringify(states));
 return {count:seen.size,employees:[...seen].map(id=>employeeById.get(id)?.name||id)};
}
function restorePending(){
 let saved=null;try{saved=JSON.parse(localStorage.getItem(pendingKey)||'null')}catch{}
 if(saved&&saved.taskId&&saved.task){
  $('resumeTaskId').value=saved.taskId;
  $('task').value=saved.task;
  $('pendingNote').textContent='미완료 업무가 발견되어 기존 업무 ID와 지시 내용을 자동으로 불러왔습니다. 새 업무가 아니라 이 업무를 이어서 처리합니다.';
  $('send').textContent='보존된 기존 업무 이어서 처리';
 }
}
restorePending();
$('send').addEventListener('click',async()=>{
 const token=$('token').value.trim();
 if(!token){$('result').textContent='staging 인증 토큰을 입력해 주세요.';return;}
 let pending=null;try{pending=JSON.parse(localStorage.getItem(pendingKey)||'null');}catch{}
 const typedTask=$('task').value.trim();
 const task=(pending&&pending.taskId&&pending.task)?pending.task:typedTask;
 if(!task){$('result').textContent='테스트 업무 지시를 입력해 주세요.';return;}
 if(!Array.isArray(employeeDirectory)||!employeeDirectory.some(e=>e.id==='COO')){$('result').textContent='employees.js에서 본부장(COO) 데이터를 찾지 못했습니다.';return;}
 const button=$('send');button.disabled=true;
 const taskId=pending&&pending.taskId?pending.taskId:crypto.randomUUID();
 let quotaRetryCount=readQuotaRetryCount(taskId);
 $('task').value=task;
 localStorage.setItem(pendingKey,JSON.stringify({task,taskId}));
 $('resumeTaskId').value=taskId;
 setStagingEmployeesIdle('새 업무를 시작하기 전 대기 상태로 전환했습니다.',taskId);
 setHeadState('업무 중','스테이징 업무를 처리하고 있습니다.');
 const payload={task,taskId,idempotencyKey:taskId,employees:employeeDirectory};
 try{
  for(let step=1;step<=1000;step++){
   $('result').textContent=`업무 처리 중 (${step}/1000)
같은 업무 ID로 저장된 결과를 이어서 처리하고 있습니다.`;
   const response=await fetch(STAGING_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(payload)});
   const raw=await response.text();let data;try{data=JSON.parse(raw);}catch{data={responseText:raw};}
   const employeeSync=syncEmployeeStates(data,taskId);
   $('employeeSyncNote').textContent=employeeSync.count
    ? `직원 상태 연결 확인: ${employeeSync.employees.join(', ')} (${employeeSync.count}명)`
    : '서버 응답에서 직원별 배정 정보가 확인되지 않았습니다. 본부장 상태만 표시합니다.';
   if(response.ok&&data.reply&&data.workflow&&['completed','partial','failed'].includes(data.workflow.status)){
    setHeadState('보고 완료','스테이징 업무 처리가 종료되어 대표 최종 결정 대기 상태입니다.');
    localStorage.removeItem(pendingKey);
    localStorage.removeItem(quotaRetryKey);
    $('result').textContent=`업무 처리 종료: ${data.workflow.resultStatus||data.workflow.status}\nHTTP ${response.status}\n\n${JSON.stringify(data,null,2)}`;return;
   }
   if(data.status==='WAITING_FOR_API_QUOTA'){
    quotaRetryCount++;
    saveQuotaRetryCount(taskId,quotaRetryCount);
    if(quotaRetryCount<=MAX_QUOTA_RETRIES){
     setHeadState('대기','OpenRouter 호출 한도 회복을 기다리는 중입니다. 기존 업무 ID를 유지합니다.');
     $('result').textContent=`OpenRouter 호출 한도로 대기 중입니다.\n기존 업무 ID: ${taskId}\n새 업무를 만들지 않고 5분 간격으로 최대 24시간 자동 재시도합니다. (${quotaRetryCount}/${MAX_QUOTA_RETRIES})\n브라우저 탭을 닫지 않으면 계속 진행합니다.`;
     await sleep(300000);continue;
    }
    setStagingEmployeesIdle('OpenRouter 호출 한도로 자동 재시도 한도에 도달했습니다. 기존 업무 결과는 보존되어 있습니다.',taskId);
    setHeadState('대기','OpenRouter 호출 한도로 자동 재시도가 종료되었습니다.');
    $('result').textContent=`OpenRouter 사용 한도로 자동 재시도를 종료했습니다.\n같은 업무 ID가 보존되어 있습니다: ${taskId}\n새 업무를 만들지 않았습니다.\n\n${JSON.stringify(data,null,2)}`;return;
   }
   if(response.status===202&&data.status==='PROCESSING'){
    setHeadState((data.currentStage||'').includes('검수')?'검수 중':(data.currentStage||'').includes('협업')?'협업 중':'업무 중',`현재 단계: ${data.currentStage||'확인 중'}`);
    $('result').textContent=`업무 처리 중 (${step}/1000)
현재 단계: ${data.currentStage||'확인 중'}
저장된 AI 결과: ${data.cachedAiCallCount??0}건
다음 처리 단위로 자동 연결합니다.`;
    await sleep(1200);continue;
   }
   if(response.status===409&&data.status==='PROCESSING'){
    $('result').textContent=`기존 실행이 끝나기를 기다리는 중 (${step}/1000)
${JSON.stringify(data,null,2)}`;
    await sleep(2500);continue;
   }
   $('result').textContent=`HTTP ${response.status}\n\n${JSON.stringify(data,null,2)}`;return;
  }
  setHeadState('업무 중','처리 단위 제한에 도달했습니다. 기존 업무가 서버에 보존되어 있습니다.');
  $('result').textContent='1000회 처리 단위에 도달했습니다. 업무 기록은 서버에 남아 있습니다. 동일한 업무 ID로 이어서 처리해야 합니다.';
 }catch(error){setHeadState('업무 중',`요청 오류: ${error.message}`);$('result').textContent=`요청 실패: ${error.message}\n\n서버에 저장된 업무는 유지될 수 있습니다. 같은 업무를 새로 접수하지 마세요.`;}
 finally{$('token').value='';button.disabled=false;}
});
</script>
</body>
</html>
