<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SW AI OFFICE | 가상 사무실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
<style>
:root{--navy:#172338;--ink:#26364b;--muted:#65748a;--floor:#e9e2d2;--line:#b8ae9c;--glass:#9bc5ca;--wood:#9c704d}
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef4fc;font-family: 'NanumSquare',sans-serif}
header{height:62px;background:#172338;border-bottom:1px solid #34445c;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.brand{font-weight:900;letter-spacing:1.4px;color:#a8d0ff;font-size:20px}.head{display:flex;align-items:center;gap:14px;font-size:13px;color:#c5d2e4}
nav a{color:#dbeafe;text-decoration:none;border:1px solid #526783;padding:9px 13px;border-radius:7px}
main{max-width:1600px;margin:auto;padding:18px}
.intro{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:14px}.intro h1{font-size:23px;margin:0 0 5px}.intro p{margin:0;color:#aebbd0;font-size:13px}
.stats{display:flex;gap:7px;flex-wrap:wrap}.stat{background:#1d2c43;border:1px solid #354760;border-radius:8px;padding:8px 11px;font-size:12px;color:#bdcbe0}.stat b{font-size:17px;color:#fff;margin-right:4px}
.shell{background:#d0c9b9;border:8px solid #2a3a50;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px #0008}
.shellbar{height:32px;background:#354861;color:#e5edf7;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:11px;letter-spacing:.5px}
.floor{padding:12px;background-color:#d9d1c1;background-image:linear-gradient(90deg,#c6bdac 1px,transparent 1px),linear-gradient(#c6bdac 1px,transparent 1px);background-size:24px 24px}
.plan{display:grid;grid-template-columns:1fr 1fr 1.35fr 1fr;grid-template-rows:220px 220px 190px;gap:9px;min-height:650px}
.room{position:relative;overflow:hidden;border:3px solid #887e6d;background:#eee8dc;color:#29384c;box-shadow:inset 0 0 0 2px #fff9}
.room:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,#fff4,transparent 50%)}
.label{position:absolute;z-index:5;left:8px;top:7px;background:#fffE;border:1px solid #c5bdaf;border-radius:3px;padding:4px 7px;font-size:11px;font-weight:900;color:#40536c}
.ceo{grid-column:1;grid-row:1;background:#d9e7e8;border-color:#6e9ca5}.coo{grid-column:2;grid-row:1;background:#dce8df;border-color:#77998a}
.bigmeet{grid-column:3;grid-row:1;background:#d6e7e9;border-color:#6e9ca5}.it{grid-column:4;grid-row:1/3;background:#dce5e9;border-color:#7299a5}
.teams{grid-column:1/4;grid-row:2/4;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:7px;background:#d9d2c4;border:0;box-shadow:none;overflow:visible}
.team{position:relative;border:2px solid #9a907e;background:#eee8dc;overflow:hidden;min-height:0}
.team:nth-child(2){background:#e7e2d7}.team:nth-child(3){background:#e8e3d8}.team:nth-child(4){background:#e6e0d4}.team:nth-child(5){background:#eee6d8}.team:nth-child(6){background:#e4e7df}
.smallmeet{grid-column:1/3;grid-row:3;background:#d8e6e8;border-color:#759ba2}.cafe{grid-column:3;grid-row:3;background:#e9dfcb;border-color:#a58b68}
.glass{background-image:repeating-linear-gradient(90deg,transparent 0 35px,#ffffff70 36px 39px,transparent 40px 72px)}
.furn{position:absolute;background:#a77d59;border:3px solid #76563f;border-radius:3px;box-shadow:inset 0 -4px #0002}
.desk{width:67px;height:29px}.desk:before{content:"";position:absolute;left:24px;top:-13px;width:18px;height:13px;background:#33475d;border:2px solid #8094a6}
.sofa{position:absolute;width:74px;height:25px;background:#648a91;border:4px solid #456b72;border-radius:5px}
.round{position:absolute;width:65px;height:65px;border-radius:50%;background:#bd956a;border:4px solid #896747}
.oval{position:absolute;width:150px;height:55px;border-radius:50%;background:#bd956a;border:4px solid #896747}
.chair{position:absolute;width:17px;height:17px;border-radius:4px;background:#637c8d;border:2px solid #435b6e}
.plant{position:absolute;width:13px;height:13px;border-radius:50%;background:#548d65;box-shadow:-6px 4px #6ba275,6px 4px #397b54}
.person{position:absolute;width:25px;height:36px;z-index:8;cursor:pointer;transition:left .7s,top .7s;filter:drop-shadow(2px 2px 0 #0003)}
.person .hair{position:absolute;left:5px;top:0;width:16px;height:8px;background:var(--hair,#46372e);border:1px solid #2d2927}
.person .face{position:absolute;left:6px;top:7px;width:14px;height:13px;background:var(--skin,#efc69f);border:1px solid #a77e66}
.person .shirt{position:absolute;left:3px;top:20px;width:20px;height:12px;background:var(--shirt,#527ba8);border:1px solid #354e69}
.person .legs{position:absolute;left:6px;top:31px;width:5px;height:5px;background:#344258;box-shadow:8px 0 #344258}
.person .tag{position:absolute;top:37px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;font-weight:900;color:#243348;background:#fffE;border:1px solid #b8b0a2;border-radius:3px;padding:2px 4px}
.person .dot{position:absolute;right:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:#9aa5b3;border:1px solid white}
.person[data-state="업무 중"] .dot{background:#39a66d}.person[data-state="협업 중"] .dot{background:#438de0}.person[data-state="검수 중"] .dot{background:#d39a35}.person[data-state="휴식 중"] .dot{background:#a78bce}
.bottomnote{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#c4d0df;font-size:12px;padding:12px 3px}
.legend{display:flex;gap:12px;flex-wrap:wrap}.legend span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#9aa5b3;margin-right:5px}.legend .work:before{background:#39a66d}.legend .collab:before{background:#438de0}.legend .review:before{background:#d39a35}.legend .rest:before{background:#a78bce}
.modal{display:none;position:fixed;inset:0;background:#07101dcc;z-index:50;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.profile{width:min(430px,100%);background:#1d2c42;border:1px solid #526783;border-radius:12px;padding:20px;box-shadow:0 20px 60px #0009}.profile h2{margin:0 0 6px}.profile p{color:#c3d0e2;font-size:14px;line-height:1.6}.profile button{background:#35577e;border:0;color:white;padding:9px 14px;border-radius:6px;cursor:pointer}
@media(max-width:900px){.plan{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,210px)}.ceo{grid-column:1;grid-row:1}.coo{grid-column:2;grid-row:1}.bigmeet{grid-column:1/3;grid-row:2}.it{grid-column:2;grid-row:3/5}.teams{grid-column:1;grid-row:3/5;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr)}.smallmeet{grid-column:1;grid-row:5}.cafe{grid-column:2;grid-row:5}}
@media(max-width:560px){header{padding:0 12px}.head{gap:7px;font-size:11px}main{padding:10px}.floor{padding:6px}.plan{gap:5px;grid-template-rows:repeat(5,190px)}.teams{gap:4px}.person .tag{font-size:8px}.stat{padding:6px 8px}}
</style>
</head>
<body>
<header><div class="brand">SW AI OFFICE <small>VIRTUAL COMPANY</small></div><div class="head"><span>가상 사무실</span><nav><a href="./index.html">업무 대시보드 ↗</a></nav></div></header>
<main>
<section class="intro"><div><h1>AI 가상 사무실</h1><p>확정된 공간 구성 기준 · 직원 캐릭터를 선택하면 프로필을 확인할 수 있습니다.</p></div><div class="stats"><div class="stat"><b id="total">33</b> 전체 직원</div><div class="stat"><b id="working">0</b> 업무 중</div><div class="stat"><b id="collab">0</b> 협업 중</div><div class="stat"><b id="review">0</b> 검수 중</div><div class="stat"><b id="idle">33</b> 대기</div></div></section>
<section class="shell"><div class="shellbar"><span>SW AI OFFICE · FLOOR 01</span><span>실시간 직원 현황</span></div><div class="floor"><div class="plan">
<section class="room ceo"><span class="label">피터 대표이사실</span><div class="furn sofa" style="left:12px;bottom:18px"></div><div class="furn round" style="right:27px;top:68px"></div><i class="chair" style="right:48px;top:54px"></i><i class="chair" style="right:48px;top:133px"></i><i class="chair" style="right:8px;top:94px"></i><i class="plant" style="right:9px;bottom:12px"></i></section>
<section class="room coo"><span class="label">알렉스 본부장실</span><div class="furn oval" style="left:50%;top:57%;transform:translate(-50%,-50%)"></div><i class="chair" style="left:calc(50% - 12px);top:42px"></i><i class="chair" style="left:calc(50% - 12px);bottom:25px"></i><i class="chair" style="left:calc(50% - 88px);top:91px"></i><i class="chair" style="right:calc(50% - 88px);top:91px"></i></section>
<section class="room bigmeet"><span class="label">대회의실</span><div class="furn oval" style="left:50%;top:57%;transform:translate(-50%,-50%);width:220px;height:76px"></div><i class="chair" style="left:calc(50% - 10px);top:45px"></i><i class="chair" style="left:calc(50% - 10px);bottom:25px"></i><i class="chair" style="left:calc(50% - 132px);top:100px"></i><i class="chair" style="right:calc(50% - 132px);top:100px"></i></section>
<section class="room it glass"><span class="label">기술·IT팀 유리실</span></section>
<section class="room teams" id="teamGrid"></section>
<section class="room smallmeet"><span class="label">소회의실</span><div class="furn oval" style="left:50%;top:60%;transform:translate(-50%,-50%);width:145px;height:50px"></div><i class="chair" style="left:calc(50% - 8px);top:47px"></i><i class="chair" style="left:calc(50% - 8px);bottom:18px"></i></section>
<section class="room cafe"><span class="label">카페테리아 · 휴게 공간</span><div class="furn round" style="left:25px;top:70px;width:43px;height:43px"></div><div class="furn round" style="right:25px;top:70px;width:43px;height:43px"></div><div class="furn" style="left:50%;bottom:17px;transform:translateX(-50%);width:90px;height:22px;background:#b68e61"></div></section>
</div></div></section>
<div class="bottomnote"><div class="legend"><span class="work">업무 중</span><span class="collab">협업 중</span><span class="review">검수 중</span><span class="rest">휴식 중</span><span>회색: 대기</span></div><span id="syncNote">업무 엔진의 직원별 상태 데이터 연결 대기 중</span></div>
</main>
<div class="modal" id="modal"><div class="profile"><h2 id="pName"></h2><div id="pRole"></div><p id="pState"></p><p id="pDetail"></p><button id="close">닫기</button></div></div>
<script type="module">
import employeeDirectory from './employees.js';
const teams=[
 {name:'경영관리팀',key:'경영관리',cls:'관리'},
 {name:'법무팀',key:'법무',cls:'법무'},
 {name:'IR팀',key:'IR',cls:'IR'},
 {name:'총무팀',key:'총무',cls:'총무'},
 {name:'전략기획팀',key:'전략기획',cls:'전략'},
 {name:'기술·IT팀',key:'기술·IT',cls:'기술'}
];
const all=[{id:'CEO',name:'피터',department:'대표이사실',position:'대표이사',instruction:'최종 의사결정자'} ,...employeeDirectory];
const colors=['#527ba8','#668d77','#a87558','#8172a5','#b08a4f','#557e86'];
const teamGrid=document.getElementById('teamGrid');
teams.forEach((team,i)=>{const el=document.createElement('section');el.className='team';el.dataset.team=team.key;const label=document.createElement('span');label.className='label';label.textContent=team.name;el.append(label);teamGrid.append(el)});
const roomFor=e=>e.id==='CEO'?'ceo':e.id==='COO'?'coo':e.department==='기술·IT'?'it':e.department;
const targetFor=e=>{const room=roomFor(e);if(room==='ceo')return document.querySelector('.ceo');if(room==='coo')return document.querySelector('.coo');if(room==='it')return document.querySelector('.it');return [...document.querySelectorAll('.team')].find(x=>x.dataset.team===room)||document.querySelector('.teams')};
function loadStates(){try{return JSON.parse(localStorage.getItem('swAIOfficeEmployeeStates')||'{}')}catch{return {}}}
let states=loadStates();
function stateOf(e){const v=states[e.id];return v&&['업무 중','협업 중','검수 중','휴식 중','대기'].includes(v.status)?v:{status:'대기',detail:'현재 직원별 업무 상태 데이터가 연결되지 않았습니다.'}}
function placePeople(){all.forEach((e,i)=>{const room=targetFor(e);if(!room)return;const p=document.createElement('div');p.className='person';p.dataset.id=e.id;p.dataset.state=stateOf(e).status;p.style.setProperty('--shirt',colors[i%colors.length]);p.innerHTML='<span class="hair"></span><span class="face"></span><span class="shirt"></span><span class="legs"></span><span class="dot"></span><span class="tag"></span>';p.querySelector('.tag').textContent=e.name;p.title=e.name+' · '+e.position;const count=room.querySelectorAll('.person').length;const cols=Math.max(2,Math.floor((room.clientWidth||250)/62));p.style.left=(10+(count%cols)*Math.min(62,Math.max(48,(room.clientWidth-42)/cols)))+'px';p.style.top=(48+Math.floor(count/cols)*57)+'px';p.addEventListener('click',()=>showProfile(e));room.append(p)})}
function refresh(){states=loadStates();let counts={'업무 중':0,'협업 중':0,'검수 중':0,'휴식 중':0,'대기':0};all.forEach(e=>{const s=stateOf(e);counts[s.status]++;const p=document.querySelector('[data-id="'+e.id+'"]');if(p){p.dataset.state=s.status;p.querySelector('.dot').title=s.status}});document.getElementById('working').textContent=counts['업무 중'];document.getElementById('collab').textContent=counts['협업 중'];document.getElementById('review').textContent=counts['검수 중'];document.getElementById('idle').textContent=counts['대기']+counts['휴식 중'];}
function showProfile(e){const s=stateOf(e);document.getElementById('pName').textContent=e.name;document.getElementById('pRole').textContent=e.department+' · '+e.position;document.getElementById('pState').textContent='현재 상태: '+s.status;document.getElementById('pDetail').textContent=s.detail||'상세 업무 정보가 연결되면 이곳에 표시됩니다.';document.getElementById('modal').classList.add('show')}
document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')});
placePeople();refresh();window.addEventListener('storage',e=>{if(e.key==='swAIOfficeEmployeeStates')refresh()});setInterval(refresh,3000);
document.getElementById('total').textContent=all.length;
</script>
</body></html>
