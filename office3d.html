<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SW AI OFFICE | 3D 가상 사무실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
<style>
:root{color-scheme:dark;--panel:#142238;--line:#49617d;--muted:#b8c8da}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9eafbb;font-family:NanumSquare,sans-serif;color:#f4f8ff}#scene{position:fixed;inset:0}
header{position:fixed;z-index:5;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}.brand,.tools,.hud,.hint{pointer-events:auto;background:#142238ed;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #10203355;backdrop-filter:blur(10px)}.brand{padding:12px 16px;font-weight:900;letter-spacing:1px;color:#d8ebff}.brand small{display:block;margin-top:4px;font-size:10px;color:#a9bfd8;letter-spacing:1.5px}.tools{display:flex;gap:7px;padding:7px}.tools button,.action{border:1px solid #607b99;background:#29435f;color:white;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}.tools button:hover,.action:hover{background:#3a5d7d}
.hud{position:fixed;z-index:4;left:16px;bottom:16px;padding:13px;width:270px}.hud h2{font-size:14px;margin:0 0 10px}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.count{padding:8px;background:#20334d;border-radius:8px}.count b{display:block;font-size:18px}.count span{font-size:10px;color:#c2d0df}.hint{position:fixed;right:16px;bottom:16px;padding:10px 13px;font-size:11px;color:#dbe8f7}
.modal{display:none;position:fixed;z-index:10;inset:0;background:#07111dcc;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.dialog{width:min(430px,100%);background:#172940;border:1px solid #59728f;border-radius:15px;padding:20px}.dialog h2{margin:0 0 5px}.sub{color:#b4c5d8;font-size:13px}.dialog p{line-height:1.55;color:#e0e9f3}.dialog textarea{width:100%;min-height:105px;background:#0d1929;border:1px solid #526a86;border-radius:9px;color:white;padding:10px;font:inherit}.row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.secondary{background:#1b2b40!important}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#9eafbb;color:#17283b;font-weight:700}
@media(max-width:650px){header{left:8px;right:8px;top:8px}.brand{font-size:12px;padding:9px}.tools{gap:3px;padding:4px}.tools button{font-size:10px;padding:7px}.hud{left:8px;bottom:8px;width:220px}.hint{right:8px;bottom:8px;max-width:125px;font-size:9px}}
</style>
</head>
<body>
<div id="scene"></div><div id="loading">SW AI OFFICE 3D 공간을 준비하고 있습니다...</div>
<header><div class="brand">SW AI OFFICE<small>가상 본사 · 3D OFFICE</small></div><div class="tools"><button id="home">전체 보기</button><button id="rotate">자동 회전</button><button id="view2d">2D 보기</button><button id="dashboard">업무 화면</button></div></header>
<section class="hud"><h2>가상 사무실 현황</h2><div class="counts"><div class="count"><b id="staffCount">-</b><span>구성원</span></div><div class="count"><b>6</b><span>팀</span></div><div class="count"><b id="selectedCount">0</b><span>선택 직원</span></div></div></section>
<div class="hint">드래그: 시점 회전 · 휠: 확대/축소 · 직원 클릭: 업무 지시</div>
<div class="modal" id="modal"><div class="dialog"><h2 id="personName">직원</h2><div class="sub" id="personRole"></div><p id="personInfo"></p><textarea id="taskText" placeholder="이 직원에게 지시할 업무를 입력하세요."></textarea><div class="row"><button class="action secondary" id="close">닫기</button><button class="action" id="taskButton">업무 지시하기</button></div></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import directory from './employees.js';
const mount=document.getElementById('scene'),scene=new THREE.Scene();
scene.background=new THREE.Color(0xaebfca);scene.fog=new THREE.Fog(0xaebfca,48,100);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,180);camera.position.set(37,34,43);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;mount.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=19;controls.maxDistance=82;
scene.add(new THREE.HemisphereLight(0xf2f7ff,0x81796d,2.15));const sun=new THREE.DirectionalLight(0xfff1dc,3.2);sun.position.set(-22,34,22);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-40;sun.shadow.camera.right=40;sun.shadow.camera.top=40;sun.shadow.camera.bottom=-40;scene.add(sun);
const mat=(color,opts={})=>new THREE.MeshStandardMaterial({color,roughness:.82,...opts});
const M={floor:mat(0xd8d2c6),wall:mat(0xe8e4dc),wood:mat(0x98704e),wood2:mat(0x644a39),glass:mat(0x8ec5d0,{transparent:true,opacity:.28,roughness:.18}),metal:mat(0x607487),screen:mat(0x24394f,{emissive:0x14263a}),fabric:mat(0x718b91),green:mat(0x56815d),rug:mat(0xc1c9c1)};
function cube(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function textSprite(txt,x,z){const c=document.createElement('canvas');c.width=512;c.height=128;const q=c.getContext('2d');q.fillStyle='rgba(250,252,255,.94)';q.beginPath();q.roundRect(8,12,496,104,18);q.fill();q.fillStyle='#34495e';q.font='bold 42px sans-serif';q.textAlign='center';q.textBaseline='middle';q.fillText(txt,256,65);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false}));s.position.set(x,3.25,z);s.scale.set(6.4,1.6,1);scene.add(s)}
function room(cx,cz,w,d,name,{glass=true,back=true}={}){cube(w,.28,d,M.floor,cx,-.12,cz);const wallMat=glass?M.glass:M.wall;cube(w,.18,.18,M.wall,cx,.12,cz-d/2);cube(.18,2.8,d,wallMat,cx-w/2,1.45,cz);cube(.18,2.8,d,wallMat,cx+w/2,1.45,cz);if(back)cube(w,2.8,.18,wallMat,cx,1.45,cz+d/2);textSprite(name,cx,cz-d/2+1.1)}
function desk(x,z,rot=0){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;cube(1.8,.16,.9,M.wood,0,1.03,0,g);for(const a of [-.72,.72])for(const b of [-.32,.32])cube(.12,.94,.12,M.wood2,a,.48,b,g);cube(.62,.42,.08,M.metal,0,1.34,-.2,g);cube(.53,.29,.025,M.screen,0,1.35,-.145,g);scene.add(g)}
function chair(x,z){const g=new THREE.Group();g.position.set(x,0,z);cube(.58,.12,.58,M.metal,0,.58,0,g);cube(.58,.68,.13,M.metal,0,.91,-.23,g);const stem=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.5,8),M.metal);stem.position.y=.25;g.add(stem);scene.add(g)}
function table(x,z,w=3,d=1.5,round=false){const top=new THREE.Mesh(round?new THREE.CylinderGeometry(w/2,w/2,.18,32):new THREE.BoxGeometry(w,.18,d),M.wood);top.position.set(x,.94,z);top.castShadow=true;scene.add(top);for(const dx of (round?[-.3,.3]:[-w*.38,w*.38]))for(const dz of (round?[-.3,.3]:[-d*.3,d*.3]))cube(.13,.88,.13,M.wood2,x+dx,.44,z+dz)}
function sofa(x,z,rot=0){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;cube(2.4,.48,.85,M.fabric,0,.48,0,g);cube(2.4,.75,.18,M.fabric,0,.92,-.34,g);for(const dx of [-1.02,1.02])cube(.2,.7,.85,M.fabric,dx,.72,0,g);scene.add(g)}
function plant(x,z){const p=new THREE.Mesh(new THREE.CylinderGeometry(.24,.3,.42,12),M.wood);p.position.set(x,.21,z);scene.add(p);const l=new THREE.Mesh(new THREE.SphereGeometry(.55,12,9),M.green);l.position.set(x,.85,z);l.scale.y=1.25;scene.add(l)}
// 넓은 단일 평면과 외곽 구조
cube(54,.55,48,M.floor,0,-.38,0);const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x849aa6));ground.rotation.x=-Math.PI/2;ground.position.y=-.68;ground.receiveShadow=true;scene.add(ground);
cube(54,3,.28,M.wall,0,1.1,-24);cube(54,3,.28,M.wall,0,1.1,24);cube(.28,3,48,M.wall,-27,1.1,0);cube(.28,3,48,M.wall,27,1.1,0);
// 상단 임원·회의 공간: 대표이사실 / 본부장실 / 대회의실 / 소회의실
room(-18,-12,12,12,'대표이사실 · 피터');room(-5,-12,12,12,'본부장실 · 알렉스');room(8,-12,13,12,'대회의실');room(19.5,-12,9,12,'소회의실');
sofa(-20,-14.7);sofa(-16,-14.7);desk(-19,-9.5);chair(-19,-10.8);table(-17,-9.2,2,2,true);for(let i=0;i<3;i++){const a=i*Math.PI*2/3;chair(-17+Math.cos(a)*1.55,-9.2+Math.sin(a)*1.55)}
table(-5,-12,4.2,2);for(let i=0;i<4;i++){const a=i*Math.PI/2;chair(-5+Math.cos(a)*2.55,-12+Math.sin(a)*1.45)}
table(8,-12,7,2.3);for(let i=0;i<6;i++){chair(5+i*1.2,-9.8);chair(5+i*1.2,-14.2)}
table(19.5,-12,4,1.7);for(let i=0;i<4;i++)chair(18+i,-9.8);
plant(-23,-16);plant(-.5,-16);
// 아래쪽 6개 팀을 3열 x 2행으로 독립 배치
const teams=[
{name:'경영관리팀',dept:'경영관리',cx:-16,cz:-2},
{name:'법무팀',dept:'법무',cx:0,cz:-2},
{name:'IR팀',dept:'IR',cx:16,cz:-2},
{name:'총무팀',dept:'총무',cx:-16,cz:8},
{name:'전략기획팀',dept:'전략기획',cx:0,cz:8},
{name:'기술·IT팀',dept:'기술·IT',cx:16,cz:8}
];
for(const t of teams){
  room(t.cx,t.cz,15,9,t.name);
  // 7석 T자형: 팀장 1석 상단 중앙, 전문 직원 6석 아래 2열
  const seats=[
    [t.cx,t.cz-3.05],
    [t.cx-4.1,t.cz-.55],[t.cx,t.cz-.55],[t.cx+4.1,t.cz-.55],
    [t.cx-4.1,t.cz+2.0],[t.cx,t.cz+2.0],[t.cx+4.1,t.cz+2.0]
  ];
  for(const [x,z] of seats){desk(x,z);chair(x,z+1.02)}
}
// 팀 사이 유리 파티션 강조
for(const z of [3])cube(47,.12,.12,M.glass,0,1.18,z);
// 하단 휴게·카페 구역은 우측 팀 공간 바깥의 코너에 배치
cube(7,.18,3.2,M.rug,20, -.02,15.7);table(20,15.4,2.4,1.3);for(let i=0;i<3;i++)chair(18.7+i*1.25,16.7);sofa(22.1,15.1);plant(23,17);textSprite('카페테리아 · 휴게 공간',19.5,14.2);
// 직원 아바타: 부서별 구역 안에 배치
const hairColors=[0x382b25,0x241f20,0x57402d,0x1d2632],shirts=[0x4d7294,0x5d806f,0x8a6d91,0x9a7657,0x53657f,0x567f85];
const avatarRoot=new THREE.Group();scene.add(avatarRoot);const avatars=[];
function makeAvatar(person,index,x,z){const g=new THREE.Group();g.position.set(x,0,z);g.userData.person=person;const shirt=mat(shirts[index%shirts.length]),hair=mat(hairColors[index%hairColors.length]),skin=mat(0xe6bd9c),pants=mat(0x344256);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.48,4,9),shirt);torso.position.y=.84;g.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.22,14,12),skin);head.position.y=1.45;g.add(head);const cap=new THREE.Mesh(new THREE.SphereGeometry(.228,14,9,0,Math.PI*2,0,Math.PI*.52),hair);cap.position.y=1.53;g.add(cap);for(const side of [-1,1]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.075,.07,.42,8),pants);leg.position.set(side*.12,.25,0);g.add(leg);const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.065,.3,3,7),shirt);arm.position.set(side*.29,.9,0);arm.rotation.z=side*.18;g.add(arm)}const ring=new THREE.Mesh(new THREE.TorusGeometry(.4,.035,7,24),new THREE.MeshBasicMaterial({color:0x7fd0ff}));ring.rotation.x=Math.PI/2;ring.position.y=.04;ring.visible=false;g.add(ring);g.userData.marker=ring;g.userData.phase=index*.73;g.traverse(o=>{if(o.isMesh){o.userData.avatar=g;o.castShadow=true}});avatarRoot.add(g);avatars.push(g)}
const peter={id:'CEO',name:'피터',department:'대표이사실',position:'대표이사',instruction:'SW AI OFFICE 대표이사'};
const staff=[peter,...directory];
const zoneSlots={
'본부장실':[[-5,-10.3]],
'경영관리':[[-16,-3.3],[-20.1,-.9],[-16,-.9],[-11.9,-.9],[-20.1,1.65],[-16,1.65],[-11.9,1.65]],
'법무':[[0,-3.3],[-4.1,-.9],[0,-.9],[4.1,-.9],[-4.1,1.65],[0,1.65],[4.1,1.65]],
'IR':[[16,-3.3],[11.9,-.9],[16,-.9],[20.1,-.9],[11.9,1.65],[16,1.65],[20.1,1.65]],
'총무':[[-16,6.7],[-20.1,9.1],[-16,9.1],[-11.9,9.1],[-20.1,11.65],[-16,11.65],[-11.9,11.65]],
'전략기획':[[0,6.7],[-4.1,9.1],[0,9.1],[4.1,9.1],[-4.1,11.65],[0,11.65],[4.1,11.65]],
'기술·IT':[[16,6.7],[11.9,9.1],[16,9.1],[20.1,9.1],[11.9,11.65],[16,11.65],[20.1,11.65]]
};
const used={};function nextSlot(dept){const a=zoneSlots[dept]||[[0,0]];const n=used[dept]||0;used[dept]=n+1;return a[n%a.length]}
makeAvatar(peter,0,-19,-8.1);
const characterNames={'COO':'알렉스','MA-01':'데니스','LE-01':'단테','IR-01':'라이언','GA-01':'에이든','SP-01':'에릭'};
for(const p of directory){
  const displayPerson={...p,name:characterNames[p.id]||p.name};
  if(p.id==='COO'){makeAvatar(displayPerson,1,-5,-8.5);continue}
  const [x,z]=nextSlot(p.department);
  makeAvatar(displayPerson,avatars.length,x,z)
}
document.getElementById('staffCount').textContent=staff.length;
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),modal=document.getElementById('modal');let selected=null;
renderer.domElement.addEventListener('pointerdown',e=>{pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(avatarRoot.children,true);if(!hits.length)return;const a=hits[0].object.userData.avatar;if(a)selectAvatar(a)});
function selectAvatar(a){if(selected)selected.userData.marker.visible=false;selected=a;a.userData.marker.visible=true;document.getElementById('selectedCount').textContent='1';const p=a.userData.person;document.getElementById('personName').textContent=p.name;document.getElementById('personRole').textContent=(p.department||'')+' · '+(p.position||'직원');document.getElementById('personInfo').textContent=p.instruction||'담당 업무를 수행하는 직원입니다.';document.getElementById('taskText').value='';modal.classList.add('show')}
document.getElementById('close').onclick=()=>modal.classList.remove('show');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
document.getElementById('taskButton').onclick=()=>{const task=document.getElementById('taskText').value.trim(),p=selected?.userData.person;if(!p)return;const u=new URL('./index.html',location.href);u.searchParams.set('employee',p.id);if(task)u.searchParams.set('task',task);location.href=u.toString()};
let is2D=new URLSearchParams(location.search).get('view')==='2d';
const viewButton=document.getElementById('view2d');
if(is2D){
  camera.position.set(0,76,0.01);
  controls.minPolarAngle=0.001;
  controls.maxPolarAngle=0.001;
  viewButton.textContent='3D 보기';
  document.querySelector('.hint').textContent='2D 평면 보기 · 휠: 확대/축소 · 직원 클릭: 업무 지시';
}
const perspectivePosition=new THREE.Vector3(37,34,43);
viewButton.onclick=()=>{
  is2D=!is2D;
  if(is2D){
    perspectivePosition.copy(camera.position);
    camera.position.set(0,76,0.01);
    controls.minPolarAngle=0.001;
    controls.maxPolarAngle=0.001;
    controls.target.set(0,0,0);
    viewButton.textContent='3D 보기';
    document.querySelector('.hint').textContent='2D 평면 보기 · 휠: 확대/축소 · 직원 클릭: 업무 지시';
  }else{
    camera.position.copy(perspectivePosition);
    controls.minPolarAngle=0;
    controls.maxPolarAngle=Math.PI*.49;
    controls.target.set(0,0,0);
    viewButton.textContent='2D 보기';
    document.querySelector('.hint').textContent='드래그: 시점 회전 · 휠: 확대/축소 · 직원 클릭: 업무 지시';
  }
  controls.update();
};
document.getElementById('dashboard').onclick=()=>location.href='./index.html';
document.getElementById('home').onclick=()=>{
  controls.target.set(0,0,0);
  camera.position.copy(is2D?new THREE.Vector3(0,76,0.01):new THREE.Vector3(37,34,43));
  controls.update();
};
let spin=false;document.getElementById('rotate').onclick=e=>{spin=!spin;controls.autoRotate=spin;controls.autoRotateSpeed=.55;e.target.textContent=spin?'회전 끄기':'자동 회전'};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();for(const a of avatars){a.position.y=Math.sin(t*1.5+a.userData.phase)*.022;a.rotation.y=Math.sin(t*.45+a.userData.phase)*.035}controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById('loading').style.display='none';
</script>
</body></html>
