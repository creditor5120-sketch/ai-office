<script type="module">

import employeeDirectory from './employees.js';

// 기존 CEO 내부 ID는 직원 데이터 연결을 위해 유지
// 화면과 업무상 역할은 본부장으로 변경
const headOfOffice = employeeDirectory.find(
  item => item.id === 'COO'
);

const responseBox = document.getElementById('response');
const sendButton = document.getElementById('sendButton');
const requestBox = document.getElementById('request');
const retryTaskButton = document.getElementById('retryTaskButton');
 // 업무 중복 실행 방지 잠금
let isTaskRunning = false;
// Gemini API 오류로 중단된 업무 지시 복원
const PENDING_TASK_KEY = 'swAIOfficePendingTask';

// 최근 업무 기록 관리
const TASK_HISTORY_KEY = 'swAIOfficeTaskHistory';
const TASK_HISTORY_LIMIT = 10;

// 업무 진행 및 최종 검수 결과 표시
// 업무 진행 및 최종 검수 결과 표시
function renderWorkflowReview(data) {
  const oldPanel = document.getElementById('workflowReviewPanel');

  if (oldPanel) oldPanel.remove();
  if (!data) return;

  const workflow = data.workflow || {};
  const reviews = Array.isArray(data.finalReviewResults)
    ? data.finalReviewResults
    : [];

  if (!Object.keys(workflow).length && reviews.length === 0) return;

  const panel = document.createElement('div');
  panel.id = 'workflowReviewPanel';
  panel.className = 'structured-report';

  const title = document.createElement('h3');
  title.textContent = '업무 진행 및 최종 검수';
  panel.appendChild(title);

  function addItem(label, value) {
    if (value === undefined || value === null || value === '') return;

    const section = document.createElement('section');
    const heading = document.createElement('strong');
    const content = document.createElement('div');

    heading.textContent = label;
    content.textContent = String(value);

    section.append(heading, content);
    panel.appendChild(section);
  }

  addItem('업무 상태', workflow.status);
  addItem('결과 판정', workflow.resultStatus);
  addItem('판정 사유', workflow.resultStatusReason);

  if (workflow.reviewGate) {
    addItem(
      '전문 직원 검수 승인',
      workflow.reviewGate.allSpecialistsApproved === true
        ? '전체 승인'
        : '전체 승인 미확인'
    );

    addItem(
      '최종 결과 공개 가능 여부',
      workflow.reviewGate.finalReleaseAllowed === true
        ? '가능'
        : '승인 또는 추가 확인 필요'
    );
  }

  reviews.forEach((review, index) => {
    const section = document.createElement('section');

    const heading = document.createElement('strong');
    heading.textContent = review.name || `최종 검수 ${index + 1}`;

    section.appendChild(heading);

    const details = [
      ['검수 판정', review.judgment],
      ['검수 상태', review.status],
      ['검수 의견', review.details?.summary || review.review],
      ['미해결 사항', review.details?.unresolvedIssues],
      ['신규 위험', review.details?.newRisks],
      ['추가 검증 필요', review.details?.verificationNeeded]
    ];

    details.forEach(([label, value]) => {
      if (value === undefined || value === null || value === '') return;

      const line = document.createElement('p');
      line.textContent =
        `${label}: ${Array.isArray(value) ? value.join(', ') : value}`;

      section.appendChild(line);
    });

    panel.appendChild(section);
  });

  responseBox.appendChild(panel);
}

// 신규 업무·과거 이력·자동 복원에 공통으로 사용하는 대표 보고 화면
function renderExecutiveReport(reply, data) {
  const workflow = data?.workflow || null;

  const finalReviewResults = Array.isArray(data?.finalReviewResults)
    ? data.finalReviewResults
    : [];

  const executiveStatus =
    workflow?.resultStatus || workflow?.status || '판정 정보 없음';

  const executiveReason =
    workflow?.resultStatusReason || '판정 사유가 제공되지 않았습니다.';

  responseBox.innerHTML = '';

  const report = document.createElement('div');
  report.className = 'executive-report';

  const title = document.createElement('h3');
  title.textContent = '대표 보고';

  const summary = document.createElement('div');
  summary.className = 'executive-summary';

  const status = document.createElement('div');
  status.className = 'executive-status';
  status.textContent = `전체 업무 판정: ${executiveStatus}`;

  const reason = document.createElement('div');
  reason.textContent = executiveReason;

  const reviewCount = document.createElement('div');
  reviewCount.textContent =
    `최종 검수 결과: ${finalReviewResults.length}건`;

  summary.append(status, reason, reviewCount);
  report.append(title, summary);

  const details = document.createElement('details');
  details.className = 'executive-details';

  const detailsTitle = document.createElement('summary');
  detailsTitle.textContent = '본부장 상세 보고서 보기';

  const content = document.createElement('div');
  content.className = 'executive-details-content report-content';
  content.innerHTML = renderResponseContent(reply || '');

  details.append(detailsTitle, content);
  report.appendChild(details);

  responseBox.appendChild(report);

  renderWorkflowReview({
    workflow,
    finalReviewResults
  });

  const workflowPanel =
    document.getElementById('workflowReviewPanel');

  if (workflowPanel) {
    const workflowDetails = document.createElement('details');
    workflowDetails.className = 'executive-details';

    const workflowTitle = document.createElement('summary');
    workflowTitle.textContent =
      '업무 진행 및 최종 검수 상세 보기';

    responseBox.insertBefore(workflowDetails, workflowPanel);
    workflowDetails.append(workflowTitle, workflowPanel);
  }
}

function loadTaskHistory() {
  try {
    const history = JSON.parse(
      localStorage.getItem(TASK_HISTORY_KEY) || '[]'
    );
    return Array.isArray(history) ? history : [];
  } catch (error) {
    console.error('업무 기록 불러오기 실패:', error);
    return [];
  }
}

function saveTaskHistory(
  task,
  taskId,
  reply,
  deliverables,
  workflow,
  finalReviewResults
) {
  const history = loadTaskHistory();

  const record = {
    taskId,
    task,
    reply,
    deliverables,
    workflow: workflow || {},
    finalReviewResults: finalReviewResults || [],
    savedAt: new Date().toISOString()
  };

  const updated = [
    record,
    ...history.filter(item => item.taskId !== taskId)
  ].slice(0, TASK_HISTORY_LIMIT);

  localStorage.setItem(
    TASK_HISTORY_KEY,
    JSON.stringify(updated)
  );
}

function renderTaskHistory() {
  const list = document.getElementById('taskHistoryList');
  if (!list) return;

  const history = loadTaskHistory();
  list.innerHTML = '';

  if (history.length === 0) {
    list.textContent = '아직 저장된 업무 기록이 없습니다.';
    return;
  }

  history.forEach((item, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.style.textAlign = 'left';
    button.style.marginBottom = '8px';

    const date = new Date(item.savedAt).toLocaleString('ko-KR');
    const task = String(item.task || '업무 내용 없음');

    button.textContent =
      `${date}\n${task.slice(0, 100)}`;

    button.addEventListener('click', () => {
      restoreTaskHistory(index);
    });

    list.appendChild(button);
  });
}

function restoreTaskHistory(index) {
  const history = loadTaskHistory();
  const item = history[index];

  if (!item) return;

  // 공통 대표 보고 화면으로 복원
  renderExecutiveReport(item.reply || '', item);

  // 기존 결과물 복원 기능 유지
  const deliverables = Array.isArray(item.deliverables)
    ? item.deliverables
    : [];

  const deliverableText = deliverables
    .map((entry, i) => {
      const title = entry.title || `결과물 ${i + 1}`;
      return `# ${title}\n\n${entry.content || ''}`;
    })
    .join('\n\n---\n\n');

  const card = document.getElementById('deliverableCard');
  const content = document.getElementById('deliverableContent');
  const copyButton = document.getElementById('copyDeliverable');

  if (deliverableText.trim()) {
    card.style.display = 'block';
    content.innerHTML = renderMarkdown(deliverableText);

    copyButton.onclick = async () => {
      await navigator.clipboard.writeText(deliverableText);
      copyButton.textContent = '복사 완료';
    };
  } else {
    card.style.display = 'none';
    content.innerHTML = '';
  }

  // 마지막 업무 결과 저장
  localStorage.setItem(
    'myAIOfficeLastResult',
    JSON.stringify({
      reply: item.reply,
      deliverables,
      workflow: item.workflow || {},
      finalReviewResults: item.finalReviewResults || [],
      savedAt: item.savedAt
    })
  );

  window.scrollTo({ top: 0, behavior: 'smooth' });
}
  
try {
  const savedTask = JSON.parse(
    localStorage.getItem(PENDING_TASK_KEY) || 'null'
  );

  if (savedTask && savedTask.task) {
   savedTask.taskId = savedTask.taskId || crypto.randomUUID();
savedTask.idempotencyKey = savedTask.idempotencyKey || savedTask.taskId;

localStorage.setItem(
  PENDING_TASK_KEY,
  JSON.stringify(savedTask)
);
   retryTaskButton.style.display = 'block';
    requestBox.value = savedTask.task;

    responseBox.textContent =
      '이전에 접수했으나 처리가 완료되지 않은 업무가 보존되어 있어. ' +
      '기존 업무 지시를 확인하고 다시 처리할 수 있어.';
  }
} catch (error) {
  console.error('미처리 업무 복원 실패:', error);
}
 
// Markdown 출력 처리
function renderMarkdown(text) {
  const escaped = String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  const normalized = escaped.replace(
    /\\(?=(?:#{1,6}\s|\*\*|__|[-*]\s|---))/g,
    ''
  );

  return normalized
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>')
    .replace(/^# (.*)$/gm, '<h1>$1</h1>')
    .replace(/^---$/gm, '<hr>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

// JSON 검수 결과를 읽기 쉬운 보고서로 표시
function renderResponseContent(text) {
  const raw = String(text || '');

  const labels = {
    judgment: '최종 판정',
    revisionChecks: '검수 및 수정 확인',
    completedChanges: '완료된 수정 사항',
    unresolvedIssues: '미해결 사항',
    newRisks: '신규 위험',
    verificationNeeded: '추가 검증 필요 사항',
    summary: '종합 의견',
    issueRegister: '지적사항 관리',
    consistencyConflicts: '판정 정합성 문제',
    missingEvidence: '누락된 증거',
    issueId: '지적사항 번호',
    issue: '지적 내용',
    result: '반영 결과',
    status: '처리 상태',
    detail: '상세 설명',
    evidenceQuote: '확인 근거',
    evidenceLocation: '근거 위치',
    reason: '판정 사유'
  };

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderValue(value, key = '') {
    const label = labels[key] || key;

    if (Array.isArray(value)) {
      return `
        <section>
          <strong>${escapeHtml(label)}</strong>
          <div class="structured-list">
            ${value.map(item => `
              <div class="structured-item">
                ${renderValue(item)}
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    if (value && typeof value === 'object') {
      return `
        <div class="structured-object">
          ${Object.entries(value).map(([childKey, childValue]) => `
            <section>
              <strong>${escapeHtml(labels[childKey] || childKey)}</strong>
              ${renderValue(childValue, childKey)}
            </section>
          `).join('')}
        </div>
      `;
    }

    if (typeof value === 'string') {
      return `<div>${renderMarkdown(value)}</div>`;
    }

    return `<div>${escapeHtml(value ?? '')}</div>`;
  }

  // 일반 문장 속에 들어 있는 JSON도 찾아서 분리
  const parts = [];
const seenJson = new Set();
let textStart = 0;
let i = 0;

  while (i < raw.length) {
    if (raw[i] !== '{' && raw[i] !== '[') {
      i++;
      continue;
    }

    const start = i;
    const stack = [];
    let inString = false;
    let escaped = false;
    let end = -1;

    for (let j = i; j < raw.length; j++) {
      const ch = raw[j];

      if (inString) {
        if (escaped) {
          escaped = false;
        } else if (ch === '\\') {
          escaped = true;
        } else if (ch === '"') {
          inString = false;
        }
        continue;
      }

      if (ch === '"') {
        inString = true;
      } else if (ch === '{' || ch === '[') {
        stack.push(ch);
      } else if (ch === '}' || ch === ']') {
        const expected = ch === '}' ? '{' : '[';

        if (stack.pop() !== expected) break;

        if (stack.length === 0) {
          end = j + 1;
          break;
        }
      }
    }

    if (end === -1) {
      i = start + 1;
      continue;
    }

    const candidate = raw.slice(start, end);
    let parsed;

    try {
      parsed = JSON.parse(candidate);
    } catch (error) {
      i = start + 1;
      continue;
    }

    if (start > textStart) {
      parts.push(renderMarkdown(raw.slice(textStart, start)));
    }

    const jsonKey = JSON.stringify(parsed);

if (!seenJson.has(jsonKey)) {
  parts.push(`
    <div class="structured-report">
      <h3>검수 결과</h3>
      ${renderValue(parsed)}
    </div>
  `);

  seenJson.add(jsonKey);
}

textStart = end;
i = end;
  }

  if (textStart < raw.length) {
    parts.push(renderMarkdown(raw.slice(textStart)));
  }

  return parts.length ? parts.join('') : renderMarkdown(raw);
}

<script>
document.getElementById('downloadWord').addEventListener('click', async () => {
  const content = document.getElementById('deliverableContent');
  const text = content.innerText.trim();

  if (!text) {
    alert('다운로드할 결과물이 없습니다.');
    return;
  }

  if (!window.docx) {
    alert('Word 변환 라이브러리를 불러오지 못했어. 인터넷 연결을 확인해 줘.');
    return;
  }

  const { Document, Paragraph, TextRun, Packer } = window.docx;

  const paragraphs = text.split('\n').map(line =>
    new Paragraph({
      children: [new TextRun(line)]
    })
  );

  const doc = new Document({
    sections: [{
      children: paragraphs
    }]
  });

  const blob = await Packer.toBlob(doc);
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.href = url;
  link.download = 'SW_AI_OFFICE_결과물.docx';
  link.click();

  URL.revokeObjectURL(url);
});
