
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY AI OFFICE</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;padding:20px}
h1{color:#60a5fa}
.card{background:#243247;padding:20px;margin:12px 0;border-radius:12px}
button{background:#2563eb;color:white;border:0;padding:13px;border-radius:8px;width:100%;margin-top:10px;box-sizing:border-box}
textarea{width:100%;height:150px;box-sizing:border-box;padding:12px;border-radius:8px;font:inherit}
#response{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
.small{color:#cbd5e1;font-size:14px}
.role{color:#93c5fd;font-size:15px}
</style>
</head>
<body>

<h1>MY AI OFFICE</h1>
<p>나만의 AI 업무실</p>

<div class="card">
<h2>대표이사 업무실</h2>
<p class="role">CEO · 최고 의사결정 및 업무 총괄</p>
<p class="small">
모든 업무는 대표이사에게 지시해.
대표이사가 업무를 분석하고 담당 부서와 실행 방향을 결정해.
</p>

<textarea id="request" placeholder="대표이사에게 업무를 지시해."></textarea>
<button id="sendButton">대표이사에게 업무 지시</button>
</div>

<div class="card">
<h3>업무 처리 결과</h3>
<p id="response">아직 접수된 업무가 없어.</p>
</div>

<script type="module">
import employeeDirectory from './employees.js';

const ceo = employeeDirectory.find(item => item.id === 'CEO');
const responseBox = document.getElementById('response');
const sendButton = document.getElementById('sendButton');

async function sendTask() {
  const task = document.getElementById('request').value.trim();

  if (!task) {
    alert('업무 지시 내용을 입력해.');
    return;
  }

  if (!ceo) {
    responseBox.textContent = '대표이사 정보를 찾을 수 없어.';
    return;
  }

  sendButton.disabled = true;
  sendButton.textContent = '대표이사가 업무를 검토하고 있어...';
  responseBox.textContent = '업무 접수 및 분석 중...';

  try {
    const response = await fetch(
      'https://ai-office-api.creditor5120.workers.dev/',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          task,
          employee: ceo.name,
          employeeId: ceo.id,
          department: ceo.department,
          position: ceo.position,
          instruction: ceo.instruction,
          employees: employeeDirectory
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || '서버 연결 오류');
    }

    responseBox.textContent = data.reply || '응답 내용이 없어.';

  } catch (error) {
    responseBox.textContent = '오류가 발생했어: ' + error.message;
  } finally {
    sendButton.disabled = false;
    sendButton.textContent = '대표이사에게 업무 지시';
  }
}

sendButton.addEventListener('click', sendTask);
</script>

</body>
</html>
