<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SW AI OFFICE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #e9dec8;
  color: #2e261d;
  font-family: 'NanumSquare', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 상단 헤더 */
.top-bar {
  height: 52px;
  background: #f5ede0;
  border-bottom: 1px solid #d5c6ad;
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-shrink: 0;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: 6px;
  background: #8c5a2b;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-main {
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 0.3px;
  line-height: 1.1;
}

.brand-sub {
  font-size: 11px;
  color: #786956;
  line-height: 1.1;
}

.top-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.top-btn {
  background: #fbf6ec;
  color: #3a3025;
  border: 1px solid #cbbba0;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}

.top-btn.active {
  background: #8c5a2b;
  color: #fff;
  border-color: #8c5a2b;
}

/* 메인 분할 영역 */
.main-workspace {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1.45fr 1fr;
  gap: 10px;
  padding: 10px;
}

body.detail-open .floor-panel {
  display: none;
}

body.detail-open .main-workspace {
  grid-template-columns: 1fr;
}

.floor-panel {
  position: relative;
  background: #dfd3bc;
  border: 1px solid #cbbba0;
  border-radius: 8px;
  overflow: hidden;
  min-height: 0;
}

#officeCanvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
}

#officeCanvas:active {
  cursor: grabbing;
}

.active-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(251, 246, 236, 0.94);
  border: 1px solid #cbbba0;
  color: #2e7d32;
  font-size: 12px;
  font-weight: 800;
  padding: 5px 10px;
  border-radius: 6px;
  pointer-events: none;
}

.floor-controls {
  position: absolute;
  left: 10px;
  bottom: 10px;
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(251, 246, 236, 0.94);
  border: 1px solid #cbbba0;
  border-radius: 6px;
  padding: 4px 6px;
}

.floor-mini-btn {
  background: #fffaf0;
  border: 1px solid #cbbba0;
  border-radius: 4px;
  color: #3a3025;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 8px;
  cursor: pointer;
}

.floor-hint {
  font-size: 11px;
  color: #6f604d;
  padding: 0 4px;
}

/* 우측 직원 지침 및 업무 창 */
.side-panel {
  background: #f5ede0;
  border: 1px solid #cbbba0;
  border-radius: 8px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
  overflow-y: auto;
}

.profile-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid #dfd3bc;
}

.profile-icon {
  width: 38px;
  height: 38px;
  border-radius: 8px;
  background: #8c5a2b;
  color: #fff;
  font-size: 15px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.profile-name {
  font-size: 16px;
  font-weight: 900;
}

.profile-meta {
  font-size: 12px;
  color: #786956;
}

.principle-box {
  background: #fbf6ec;
  border: 1px solid #dfd3bc;
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.5;
  color: #3a3025;
  max-height: 190px;
  overflow-y: auto;
  white-space: pre-wrap;
}

.response-box {
  background: #fbf6ec;
  border: 1px solid #dfd3bc;
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 13px;
  line-height: 1.55;
  min-height: 92px;
  max-height: 240px;
  overflow-y: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.input-row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

input[type="password"],
input[type="text"],
textarea {
  width: 100%;
  background: #fffdf9;
  border: 1px solid #cbbba0;
  border-radius: 6px;
  color: #2e261d;
  font-family: inherit;
  font-size: 13px;
  padding: 8px 10px;
}

textarea#request {
  min-height: 64px;
  resize: vertical;
}

.submit-row {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.send-btn {
  background: #8c5a2b;
  color: #fff;
  border: 0;
  border-radius: 6px;
  padding: 9px 16px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}

.send-btn:hover {
  background: #734820;
}

.send-btn:disabled {
  background: #b5a68e;
  cursor: wait;
}

.retry-btn {
  background: #35684b;
  color: #fff;
  border: 0;
  border-radius: 6px;
  padding: 9px 14px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}

/* 하단 직원 스트립 */
.roster-strip {
  height: 76px;
  background: #f5ede0;
  border-top: 1px solid #d5c6ad;
  padding: 6px 10px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  flex-shrink: 0;
}

.roster-card {
  min-width: 112px;
  background: #fbf6ec;
  border: 1px solid #d5c6ad;
  border-radius: 6px;
  padding: 5px 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  flex-shrink: 0;
}

.roster-card.selected {
  border: 2px solid #8c5a2b;
  background: #fff2d8;
}

.roster-name {
  font-size: 12px;
  font-weight: 800;
}

.roster-dept {
  font-size: 10px;
  color: #786956;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.roster-state {
  font-size: 10px;
  font-weight: 700;
  color: #2e7d32;
}

/* 업무 상세/결과/이력 패널 */
.detail-drawer {
  display: none;
  background: #f5ede0;
  border: 1px solid #cbbba0;
  border-radius: 8px;
  padding: 12px 14px;
  margin-top: 6px;
}

body.detail-open .detail-drawer {
  display: grid;
  gap: 10px;
}

.detail-section {
  background: #fbf6ec;
  border: 1px solid #dfd3bc;
  border-radius: 6px;
  padding: 10px 12px;
}

.detail-section h4 {
  margin: 0 0 8px;
  font-size: 14px;
}

.tool-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.tool-btn {
  background: #efe5d3;
  border: 1px solid #cbbba0;
  border-radius: 5px;
  color: #2e261d;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 10px;
  cursor: pointer;
}

.history-item-btn {
  width: 100%;
  text-align: left;
  background: #fffdf9;
  border: 1px solid #dfd3bc;
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 6px;
  font-size: 12px;
  cursor: pointer;
}

.structured-report section {
  background: #fffdf9;
  border: 1px solid #e3d6be;
  border-radius: 6px;
  padding: 8px 10px;
  margin: 6px 0;
}

.structured-item {
  border-left: 3px solid #8c5a2b;
  padding-left: 8px;
  margin: 6px 0;
}

@media (max-width: 900px) {
  html, body {
    height: auto;
    overflow: auto;
  }
  .main-workspace {
    grid-template-columns: 1fr;
  }
  .floor-panel {
    height: 360px;
  }
  .input-row-2 {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<header class="top-bar">
  <div class="brand-wrap">
    <div class="brand-mark">SW</div>
    <div>
      <div class="brand-main">SW AI OFFICE</div>
      <div class="brand-sub">AI 가상 사무실 · 단층</div>
    </div>
  </div>
  <div class="top-controls">
    <button type="button" class="top-btn" id="resetViewBtn">전체 보기</button>
    <button type="button" class="top-btn active" id="autoRotateBtn">자동 회전</button>
    <button type="button" class="top-btn" id="view2dBtn">2D 보기</button>
    <button type="button" class="top-btn" id="toggleDetailBtn">↗ 업무 상세</button>
  </div>
</header>

<main class="main-workspace">
  <section class="floor-panel" aria-label="단층 3D 가상 사무실">
    <div class="active-badge" id="activeStaffBadge">● 활성 직원 33명</div>
    <canvas id="officeCanvas"></canvas>
    <div class="floor-controls">
      <button type="button" class="floor-mini-btn" id="zoomOutBtn">-</button>
      <button type="button" class="floor-mini-btn" id="zoomInBtn">+</button>
      <button type="button" class="floor-mini-btn" id="fitFloorBtn">전체 보기</button>
      <span class="floor-hint">드래그: 회전 · 휠: 확대/축소 · 캐릭터 클릭: 선택</span>
    </div>
  </section>

  <section class="side-panel" aria-label="직원 지침 및 업무 창">
    <div class="profile-row">
      <div class="profile-icon" id="profileAvatar">알</div>
      <div>
        <div class="profile-name" id="profileName">알렉스</div>
        <div class="profile-meta" id="profileMeta">소속 본부장실 · 직급 본부장</div>
      </div>
    </div>

    <div class="principle-box" id="principleBox"></div>

    <div class="response-box" id="response">업무 지시·답변은 이 창에 표시</div>

    <div class="input-row-2">
      <input id="officeAccessToken" type="password" autocomplete="off" placeholder="서버 접속 인증 값 입력">
      <input id="representativeAccessToken" type="password" autocomplete="off" placeholder="대표 승인 인증 값 입력">
    </div>

    <textarea id="request" placeholder="선택한 직원에게 간단한 대화나 업무지시를 입력하세요."></textarea>

    <div class="submit-row">
      <button id="retryTaskButton" type="button" class="retry-btn" style="display:none;">보존된 업무 재처리</button>
      <button id="sendButton" type="button" class="send-btn">입력 전송 →</button>
    </div>

    <div class="detail-drawer" id="detailDrawer">
      <div class="detail-section" id="deliverableCard" style="display:none;">
        <div class="tool-row">
          <button id="copyDeliverable" type="button" class="tool-btn">전체 복사</button>
          <button id="downloadWord" type="button" class="tool-btn">Word 다운로드</button>
          <button id="downloadPdf" type="button" class="tool-btn">PDF 다운로드</button>
        </div>
        <div id="deliverableContent"></div>
      </div>

      <div class="detail-section">
        <h4>최근 업무 기록</h4>
        <div id="taskHistoryList">저장된 업무 기록이 없습니다.</div>
      </div>

      <div class="detail-section">
        <h4>서버 업무 이력 조회</h4>
        <div class="input-row-2">
          <input id="serverHistoryTaskId" type="text" autocomplete="off" placeholder="조회할 업무 ID 입력">
          <button id="loadServerHistoryButton" type="button" class="tool-btn">서버 이력 조회</button>
        </div>
        <p id="serverHistoryStatus" class="profile-meta" aria-live="polite">업무 ID를 입력해 이력을 조회하세요.</p>
        <ol id="serverHistoryEvents" class="profile-meta"></ol>
      </div>
    </div>
  </section>
</main>

<footer class="roster-strip" id="rosterStrip" aria-label="직원 목록"></footer>

<script type="module">
let employeeDirectory = [];
try {
  const mod = await import('./employees.js');
  if (Array.isArray(mod.default) && mod.default.length) {
    employeeDirectory = mod.default;
  }
} catch (_) {}

if (!employeeDirectory.length) {
  employeeDirectory = [
    { id: 'CEO', name: '피터', department: '대표이사실', position: '대표이사', instruction: '최종 의사결정 및 승인을 담당한다.' },
    { id: 'COO', name: '알렉스', department: '본부장실', position: '본부장', instruction: '업무 분석, 담당 팀과 직원 배정, 진행 총괄 및 최종 보고를 담당한다.' },
    { id: 'MGMT_1', name: '베니', department: '경영관리', position: '매니저', instruction: '경영관리 및 운영 조율을 담당한다.' },
    { id: 'MGMT_2', name: '카리나', department: '경영관리', position: '담당', instruction: '경영관리 현황 집계 및 보고를 담당한다.' },
    { id: 'MGMT_3', name: '이든', department: '경영관리', position: '담당', instruction: '예산 및 자원 관리를 담당한다.' },
    { id: 'MGMT_4', name: '클로이', department: '경영관리', position: '담당', instruction: '일정 및 리스크 점검을 담당한다.' },
    { id: 'MGMT_5', name: '루카스', department: '경영관리', position: '담당', instruction: '운영 프로세스 정비를 담당한다.' },
    { id: 'LEGAL_1', name: '안나', department: '법무', position: '매니저', instruction: '계약 검토 및 법률 자문을 담당한다.' },
    { id: 'LEGAL_2', name: '벤', department: '법무', position: '담당', instruction: '규제 및 컴플라이언스 검토를 담당한다.' },
    { id: 'LEGAL_3', name: '소피아', department: '법무', position: '담당', instruction: '분쟁 및 약관 검토를 담당한다.' }
  ];
}

const COMMON_PRINCIPLES = [
  '너는 SW AI OFFICE의 정식 AI 직원이다.',
  '',
  '[공통 업무 원칙]',
  '1. 사용자의 업무 목적과 핵심 요구사항을 정확히 파악한다.',
  '2. 확인되지 않은 사실이나 수치를 만들어내지 않는다.',
  '3. 사실, 분석, 추정, 의견, 미확인 사항을 구분한다.',
  '4. 필요한 경우 법령, 자료, 출처와 근거를 제시한다.',
  '5. 막연한 설명보다 실제 활용 가능한 결과물을 우선한다.',
  '6. 사용자가 이미 제공한 정보를 다시 묻지 않는다.',
  '7. 단순히 사용자 의견에 동조하지 말고 언제든 대안을 제시한다.',
  '8. 결과물 제출 전 정확성, 누락, 논리, 수치를 자체 검수한다.',
  '9. 다른 직원의 전문 영역을 침범하지 않고 필요한 경우 협업한다.',
  '10. 중요한 외부 행동은 사용자 승인 없이 실행하지 않는다.',
  '11. 업무 결과와 미해결 사항을 명확하게 보고한다.',
  '12. 승인되지 않은 지침이나 권한을 임의로 변경하지 않는다.'
].join('\n');

const headOfOffice = employeeDirectory.find(item => item.id === 'COO') || employeeDirectory[0];

const responseBox = document.getElementById('response');
const sendButton = document.getElementById('sendButton');
const requestBox = document.getElementById('request');
const accessTokenBox = document.getElementById('officeAccessToken');
const representativeAccessTokenBox = document.getElementById('representativeAccessToken');
const retryTaskButton = document.getElementById('retryTaskButton');
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

let currentWorkflowReviewData = null;
let isTaskRunning = false;

const PENDING_TASK_KEY = 'swAIOfficeStagingPendingTask';
const TASK_HISTORY_KEY = 'swAIOfficeTaskHistory';
const TASK_HISTORY_LIMIT = 10;
const EMPLOYEE_STATE_KEY = 'swAIOfficeEmployeeStates';

const employeeById = new Map(employeeDirectory.map(e => [String(e.id), e]));
const employeeByName = new Map(employeeDirectory.map(e => [String(e.name), e]));

// 단층 사무실 구역 (2층 없음)
const ROOMS = [
  { name: '대회의실', x1: -7.2, z1: -4.4, x2: -2.4, z2: -1.4, floor: '#efe3cb' },
  { name: '업무홀', x1: -7.2, z1: -1.2, x2: -1.8, z2: 2.2, floor: '#f4ead6' },

const DESKS = [
  { x: -5.4, z: -0.2, w: 1.1, d: 0.55 },
  { x: -3.6, z: -0.2, w: 1.1, d: 0.55 },
  { x: -5.4, z: 1.2, w: 1.1, d: 0.55 },
  { x: -3.6, z: 1.2, w: 1.1, d: 0.55 },

  { x: 1.3, z: 0.1, w: 1.1, d: 0.55 },

const SOFAS = [
  { x: 3.4, z: -3.2, w: 1.1, d: 0.45 },
  { x: 3.4, z: -1.6, w: 1.1, d: 0.45 },
  { x: -0.2, z: -3.1, w: 1.2, d: 0.45 }
];

const PLANTS = [
  { x: -6.7, z: -3.9 },
  { x: 2.1, z: -3.9 },
  { x: 6.7, z: -3.9 },
  { x: -6.7, z: 4.1 },
  { x: 2.1, z: 4.1 },
  { x: 6.7, z: 4.1 }
];

const WAYPOINTS = [
  { x: -4.8, z: -2.8 },
  { x: -5.4, z: -0.8 },
  { x: -3.6, z: -0.8 },
  { x: -5.4, z: 0.6 },
  { x: -3.6, z: 0.6 },
  { x: -4.7, z: 3.5 },
  { x: -0.3, z: -0.5 },
  { x: 1.3, z: -0.5 },
  { x: 0.2, z: 3.5 },
  { x: 4.1, z: -2.4 },
  { x: 5.5, z: -2.2 },
  { x: 4.1, z: 0.5 },
  { x: 5.7, z: 0.5 },

    targetX: nextWp.x,

function project(x, y, z) {
  const cx = officeCanvas.width * 0.5 + panX;
  const cy = officeCanvas.height * 0.54 + panY;
  if (view2D) {
    return {
      x: cx + x * zoom * 0.85,
      y: cy + z * zoom * 0.85 - y * zoom * 0.35
    };
  }
  const cyaw = Math.cos(yaw), syaw = Math.sin(yaw);
  const x1 = x * cyaw - z * syaw;
  const z1 = x * syaw + z * cyaw;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const y2 = y * cp - z1 * sp;
  const z2 = y * sp + z1 * cp;
  const isoX = (x1 - z2) * 0.866;
  const isoY = (x1 + z2) * 0.45 - y2;
  return {
    x: cx + isoX * zoom * 0.65,
    y: cy + isoY * zoom * 0.65
  };
}

function drawQuad(pts, fill, stroke = '#8f7e67', lw = 1) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw;
    ctx.stroke();
  }
}

function drawBox3D(x, y, z, w, h, d, cTop, cLeft, cRight) {
  const p001 = project(x - w / 2, y, z + d / 2);
  const p100 = project(x + w / 2, y, z - d / 2);
  const p101 = project(x + w / 2, y, z + d / 2);
  const p010 = project(x - w / 2, y + h, z - d / 2);
  const p110 = project(x + w / 2, y + h, z - d / 2);
  const p111 = project(x + w / 2, y + h, z + d / 2);
  const p011 = project(x - w / 2, y + h, z + d / 2);

  drawQuad([p010, p110, p111, p011], cTop, '#7a6952', 0.8);
  drawQuad([p001, p101, p111, p011], cLeft, '#7a6952', 0.8);
  drawQuad([p100, p101, p111, p110], cRight, '#7a6952', 0.8);
}

function renderScene(nowSec) {
  canvasHits.length = 0;
  ctx.clearRect(0, 0, officeCanvas.width, officeCanvas.height);

  // 단층 바닥 외곽
  drawQuad([
    project(-7.6, 0, -4.8),
    project(7.6, 0, -4.8),
    project(7.6, 0, 5.0),
    project(-7.6, 0, 5.0)
  ], '#f6efe2', '#b8a78c', 2);

  // 각 구역 바닥 & 라벨
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ROOMS.forEach(r => {
    drawQuad([
      project(r.x1, 0.01, r.z1),
      project(r.x2, 0.01, r.z1),
      project(r.x2, 0.01, r.z2),
      project(r.x1, 0.01, r.z2)
    ], r.floor, '#c7b69b', 1.2);

    const lbl = project((r.x1 + r.x2) / 2, 0.04, r.z1 + 0.35);
    ctx.fillStyle = '#756450';
    ctx.fillText(r.name, lbl.x, lbl.y);
  });

  // 가구 (책상, 소파, 화분)
  DESKS.forEach(dk => {
    drawBox3D(dk.x, 0, dk.z, dk.w, 0.42, dk.d, '#e7d7bc', '#cbb796', '#b39e7c');
  });
  SOFAS.forEach(sf => {
    drawBox3D(sf.x, 0, sf.z, sf.w, 0.32, sf.d, '#d4794a', '#b55d32', '#964923');
  });
  PLANTS.forEach(pl => {
    drawBox3D(pl.x, 0, pl.z, 0.36, 0.28, 0.36, '#a8643c', '#874c2a', '#6b3b1f');
    drawBox3D(pl.x, 0.28, pl.z, 0.28, 0.26, 0.28, '#4f9a4b', '#3b7a37', '#2c5e29');
  });

  // 살아 움직이는 캐릭터들 (깊이순 정렬)
  const sortedActors = [...actors].sort((a, b) => (a.x + a.z) - (b.x + b.z));
  sortedActors.forEach(ac => {
    const isSel = selectedEmployee && String(selectedEmployee.id) === String(ac.emp.id);
    const bob = Math.abs(Math.sin(nowSec * 5.5 + ac.phase)) * 0.08;
    const armSwing = Math.sin(nowSec * 6 + ac.phase) * 0.14;

    // 몸통
    drawBox3D(ac.x, bob, ac.z, 0.36, 0.56, 0.28, ac.color, ac.color, '#262626');
    // 양팔 움직임
    drawBox3D(ac.x - 0.24, bob + 0.32 + armSwing * 0.3, ac.z, 0.1, 0.24, 0.12, '#e6b892', '#cfa07a', '#b58863');
    drawBox3D(ac.x + 0.24, bob + 0.32 - armSwing * 0.3, ac.z, 0.1, 0.24, 0.12, '#e6b892', '#cfa07a', '#b58863');
    // 머리
    drawBox3D(ac.x, bob + 0.56, ac.z, 0.3, 0.3, 0.3, '#f3c6a0', '#dfb089', '#c7966f');

    const topPt = project(ac.x, bob + 1.02, ac.z);
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    const label = ac.emp.name;
    const w = ctx.measureText(label).width + 10;
    const bx = topPt.x - w / 2;
    const by = topPt.y - 16;

    ctx.fillStyle = isSel ? '#8c5a2b' : '#fffaf0';
    ctx.strokeStyle = isSel ? '#4d2e11' : '#8d7b63';
    ctx.lineWidth = isSel ? 2 : 1;
    ctx.beginPath();
    ctx.roundRect(bx, by, w, 17, 4);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = isSel ? '#fff' : '#2e261d';
    ctx.fillText(label, topPt.x, topPt.y - 4);

    canvasHits.push({
      emp: ac.emp,
      x: bx,
      y: by,
      w,
      h: 17,
      cx: topPt.x,
      cy: topPt.y + 12,
      r: 18
    });
  });
}

function updateActors(dt) {
  actors.forEach((ac, idx) => {
    if (ac.pauseTimer > 0) {
      ac.pauseTimer -= dt;
      return;
    }
    const dx = ac.targetX - ac.x;
    const dz = ac.targetZ - ac.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.08) {
      ac.pauseTimer = 1.1 + (idx % 3) * 0.7;
      const nextWp = WAYPOINTS[(Math.floor(Math.random() * WAYPOINTS.length) + idx) % WAYPOINTS.length];
      ac.targetX = nextWp.x;
      ac.targetZ = nextWp.z;
    } else {
      const step = Math.min(dist, ac.speed * dt);
      ac.x += (dx / dist) * step;
      ac.z += (dz / dist) * step;
    }
  });
}

let lastFrameTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  if (autoRotate && !view2D && !dragging) {
    yaw += dt * 0.14;
  }
  updateActors(dt);
  renderScene(now / 1000);
  requestAnimationFrame(loop);
}

  if (!dragging) return;
  const moved = Math.hypot(e.clientX - lastX, e.clientY - lastY);
  dragging = false;
  if (moved < 5) {
    const rect = officeCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const hit = canvasHits.find(h =>
      (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) ||
      Math.hypot(mx - h.cx, my - h.cy) <= h.r
    );
    if (hit) {
      selectedEmployee = hit.emp;
      renderRightPanelEmployee();
      renderRosterStrip();
    }
  }
});

  if (view2D || e.shiftKey) {
    panX += dx;

function normalizeEmployeeStatus(value, stage) {
  const raw = String(value || stage || '').toLowerCase();
  if (/보완 필요|revision required|needs revision/.test(raw)) return '보완 필요';
  if (/검수|review|inspect|qa/.test(raw)) return '검수 중';
  if (/협업|collab|coordinate|meeting/.test(raw)) return '협업 중';
  if (/휴식|break/.test(raw)) return '휴식 중';
  if (/완료|complete|done|approved/.test(raw)) return '완료';
  if (/승인|대기|pending|idle/.test(raw)) return '대기';
  return '업무 중';
}

function syncEmployeeStates(data, taskId) {
  if (!data || typeof data !== 'object') return;
  let states = {};
  try {
    states = JSON.parse(localStorage.getItem(EMPLOYEE_STATE_KEY) || '{}');
  } catch (_) {}

  const stage = data.currentStage || data.workflow?.currentStage || '업무 처리';
  const now = new Date().toISOString();
  const visited = new Set();

  function applyEmployee(employee, value) {
    if (!employee) return;
    const rawStatus = value.status ?? value.state ?? value.currentStatus ?? stage;
    const detail = value.detail ?? value.description ?? value.task ?? stage;
    states[employee.id] = {
      status: normalizeEmployeeStatus(rawStatus, stage),
      detail: String(detail).slice(0, 500),
      taskId,
      updatedAt: now,
      source: 'main-response'
    };
  }

  function walk(value, depth = 0) {
    if (!value || typeof value !== 'object' || depth > 9 || visited.has(value)) return;
    visited.add(value);
    if (Array.isArray(value)) {
      value.forEach(item => walk(item, depth + 1));
      return;
    }
    const id = value.employeeId ?? value.assigneeId ?? value.staffId ??
      (employeeById.has(String(value.id ?? '')) ? value.id : null);
    const name = value.employeeName ?? value.assigneeName ?? value.staffName ??
      (typeof value.employee === 'string' ? value.employee : null);
    const emp = (id != null && employeeById.get(String(id))) ||
      (name && employeeByName.get(String(name)));
    applyEmployee(emp, value);
    Object.values(value).forEach(child => walk(child, depth + 1));
  }

  walk(data);
  states.COO = {
    status: data.status === 'WAITING_FOR_API_QUOTA' ? '대기' : (data.reply && data.workflow ? '완료' : '업무 중'),
    detail: String(stage).slice(0, 500),
    taskId,
    updatedAt: now,
    source: 'main-response'
  };
  localStorage.setItem(EMPLOYEE_STATE_KEY, JSON.stringify(states));
  renderRosterStrip();
}

function renderMarkdown(text) {
  const escaped = String(text || '')
    .replace(/&/g, '&')
    .replace(/</g, '<')
    .replace(/>/g, '>');
  return escaped
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>')
    .replace(/^# (.*)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function renderResponseContent(text) {
  return renderMarkdown(String(text || ''));
}

async function sendTask(reusePending = false) {
  let pending = null;
  if (reusePending) {
    try {
      pending = JSON.parse(localStorage.getItem(PENDING_TASK_KEY) || 'null');
    } catch (_) {}
  }

  const taskId = pending?.taskId || crypto.randomUUID();
  const idempotencyKey = pending?.idempotencyKey || taskId;
  let quotaRetryCount = Math.max(0, Number(pending?.quotaRetryCount) || 0);
  let modelUnavailableRetryCount = Math.max(0, Number(pending?.modelUnavailableRetryCount) || 0);
  let timeoutRetryCount = Math.max(0, Number(pending?.timeoutRetryCount) || 0);

  const accessToken = accessTokenBox.value.trim();
  if (!accessToken) {
    responseBox.textContent = '서버 접속 인증 값을 입력해 주세요.';
    return;
  }
  if (isTaskRunning) {
    responseBox.textContent = '이미 업무를 처리하고 있습니다.';
    return;
  }

  const task = (reusePending && pending?.task) ? pending.task : requestBox.value.trim();
  const employeesForTask = (reusePending && Array.isArray(pending?.employees)) ? pending.employees : employeeDirectory;

  if (!task) {
    alert('업무지시를 입력하세요.');
    return;
  }

  isTaskRunning = true;
  sendButton.disabled = true;
  retryTaskButton.disabled = true;
  responseBox.textContent = '업무 접수 및 팀 배정 준비 중...';

  try {
    localStorage.setItem(
      PENDING_TASK_KEY,
      JSON.stringify({
        task,
        taskId,
        idempotencyKey,
        status: 'WAITING_FOR_PROCESSING',
        quotaRetryCount,
        modelUnavailableRetryCount,
        timeoutRetryCount,
        employees: employeesForTask,
        savedAt: new Date().toISOString()
      })
    );

    let data = null;
    let completedResponse = false;
    const MAX_QUOTA_RETRIES = 48;

    for (let step = 1; step <= 1000; step++) {
      const response = await fetch('https://ai-office-api.creditor5120.workers.dev/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + accessToken
        },
        body: JSON.stringify({
          task,
          taskId,
          idempotencyKey,
          employee: headOfOffice.name,
          employeeId: headOfOffice.id,
          department: headOfOffice.department || '본부장실',
          position: headOfOffice.position || '본부장',
          instruction: headOfOffice.instruction || '',
          employees: employeesForTask
        })
      });

      const raw = await response.text();
      try {
        data = JSON.parse(raw);
      } catch (_) {
        data = { error: raw || '서버 응답을 해석할 수 없습니다.' };
      }

      syncEmployeeStates(data, taskId);

      if (response.ok && data.reply && data.workflow) {
        completedResponse = true;
        break;
      }

      if (response.status === 202 && data.status === 'PROCESSING') {
        const resumeDelayMs = Math.max(1200, Number(data.resumeDelayMs) || 1200);
        const savedForRetry = JSON.parse(localStorage.getItem(PENDING_TASK_KEY) || 'null') || {};

        if (data.modelUnavailableResumable || data.timeoutResumable) {
          const retryType = data.modelUnavailableResumable ? 'modelUnavailable' : 'timeout';
          const retryLimit = retryType === 'modelUnavailable' ? 5 : 10;
          const retryCountKey = retryType === 'modelUnavailable'
            ? 'modelUnavailableRetryCount'
            : 'timeoutRetryCount';
          const retryCount = retryType === 'modelUnavailable'
            ? ++modelUnavailableRetryCount
            : ++timeoutRetryCount;

          savedForRetry[retryCountKey] = retryCount;
          savedForRetry.updatedAt = new Date().toISOString();
          localStorage.setItem(PENDING_TASK_KEY, JSON.stringify(savedForRetry));

          if (retryCount >= retryLimit) {
            responseBox.textContent =
              `Gemini ${retryType === 'modelUnavailable' ? '서버 과부하' : '응답 시간 초과'}가 ${retryCount}회 반복되어 자동 재시도를 중단했습니다.\n` +
              '업무와 체크포인트는 보존되어 있습니다.\n' +
              '보존된 업무 재처리를 이용해 주세요.';
            retryTaskButton.style.display = 'inline-block';
            return;
          }

          responseBox.textContent =
            `Gemini ${retryType === 'modelUnavailable' ? '서버 과부하' : '응답 시간 초과'}로 보존 중 (${retryCount}/${retryLimit}) · ${Math.ceil(resumeDelayMs / 1000)}초 후 재시도`;
        } else {
          responseBox.textContent = `업무 처리 중 (${step}/1000) · 현재 단계: ${data.currentStage || '확인 중'}`;
        }

        await sleep(resumeDelayMs);
        continue;
      }

      if (response.status === 409 && data.status === 'PROCESSING') {
        responseBox.textContent = `기존 실행 대기 중 (${step}/1000)`;
        await sleep(2500);
        continue;
      }

      if (data.status === 'WAITING_FOR_API_QUOTA') {
        quotaRetryCount++;
        const quotaWaitMs = Number(data.quotaRetryAfterMs) > 0 ? Number(data.quotaRetryAfterMs) : 300000;
        const quotaPending = JSON.parse(localStorage.getItem(PENDING_TASK_KEY) || 'null');
        if (quotaPending && quotaPending.taskId === taskId) {
          quotaPending.quotaRetryCount = quotaRetryCount;
          quotaPending.status = 'WAITING_FOR_API_QUOTA';
          quotaPending.nextRetryAt = new Date(Date.now() + quotaWaitMs).toISOString();
          localStorage.setItem(PENDING_TASK_KEY, JSON.stringify(quotaPending));
        }
        if (quotaRetryCount <= MAX_QUOTA_RETRIES) {
          responseBox.textContent = `AI API 사용 한도 대기 중 (${quotaRetryCount}/${MAX_QUOTA_RETRIES}) · 약 ${Math.ceil(quotaWaitMs / 60000)}분 후 자동 재시도`;
          await sleep(quotaWaitMs);
          continue;
        }
      }

      throw new Error(data.error || '서버 연결 오류');
    }

    if (!completedResponse) {
      throw new Error('1000회 처리 단위에 도달했습니다. 보존된 업무 재처리를 눌러 이어서 진행하세요.');
    }

    const fullReply = data.reply || '응답 내용이 없습니다.';
    responseBox.innerHTML = renderResponseContent(fullReply);
    renderWorkflowReview({ taskId, workflow: data.workflow, finalReviewResults: data.finalReviewResults || [] });

    const deliverables = Array.isArray(data.deliverables) ? data.deliverables : [];
    const deliverableText = deliverables.map((item, i) => `# ${item.title || `결과물 ${i + 1}`}\n\n${item.content || ''}`).join('\n\n---\n\n');
    const delivCard = document.getElementById('deliverableCard');
    const delivContent = document.getElementById('deliverableContent');
    if (deliverableText.trim()) {
      delivCard.style.display = 'block';
      delivContent.innerHTML = renderMarkdown(deliverableText);
      document.getElementById('copyDeliverable').onclick = async () => {
        await navigator.clipboard.writeText(deliverableText);
      };
    }

    saveTaskHistory(task, taskId, fullReply, deliverables, data.workflow, data.finalReviewResults);
    renderTaskHistory();
    localStorage.removeItem(PENDING_TASK_KEY);
    retryTaskButton.style.display = 'none';
  } catch (err) {
    responseBox.textContent = '오류가 발생했어: ' + err.message;
    const saved = localStorage.getItem(PENDING_TASK_KEY);
    if (saved) retryTaskButton.style.display = 'inline-block';
  } finally {
    isTaskRunning = false;
    sendButton.disabled = false;
    retryTaskButton.disabled = false;
  }
}

renderTaskHistory();
sendButton.addEventListener('click', () => sendTask(false));

retryTaskButton.addEventListener('click', () => {
  const savedTask = JSON.parse(localStorage.getItem(PENDING_TASK_KEY) || 'null');
  if (!savedTask || !savedTask.task) {
    responseBox.textContent = '재처리할 업무가 없습니다.';
    retryTaskButton.style.display = 'none';
    return;
  }
  savedTask.modelUnavailableRetryCount = 0;
  savedTask.timeoutRetryCount = 0;
  savedTask.updatedAt = new Date().toISOString();
  localStorage.setItem(PENDING_TASK_KEY, JSON.stringify(savedTask));
  requestBox.value = savedTask.task;
  sendTask(true);
});
</script>

<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<script>
document.getElementById('downloadWord').addEventListener('click', async () => {
  const text = document.getElementById('deliverableContent').innerText.trim();
  if (!text || !window.docx) return;
  const { Document, Paragraph, TextRun, Packer } = window.docx;
  const doc = new Document({
    sections: [{ children: text.split('\n').map(line => new Paragraph({ children: [new TextRun(line)] })) }]
  });
  const blob = await Packer.toBlob(doc);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'SW_AI_OFFICE_결과물.docx';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('downloadPdf').addEventListener('click', () => {
  const html = document.getElementById('deliverableContent').innerHTML.trim();
  if (!html) return;
  const win = window.open('', '_blank');
  if (!win) return;
  win.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>결과물</title></head><body>${html}</body></html>`);
  win.document.close();
  win.onload = () => win.print();
});
</script>
