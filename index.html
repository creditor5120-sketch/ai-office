<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY AI OFFICE</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 30px;
}
h1 { color: #60a5fa; }
.office {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  max-width: 600px;
  margin: 30px auto;
}
.employee {
  background: #243247;
  padding: 25px;
  border-radius: 15px;
}
.employee h2 { font-size: 20px; }
.employee p { color: #cbd5e1; }
</style>
</head>
<body>

<h1>MY AI OFFICE</h1>
<p>나만의 AI 업무실</p>

<div class="office">
  <div class="employee">
    <h2>👔 대표 AI</h2>
    <p>업무 총괄 및 관리</p>
  </div>

  <div class="employee">
    <h2>⚖️ 법무 AI</h2>
    <p>계약 및 법률 검토</p>
  </div>

  <div class="employee">
    <h2>📊 IR AI</h2>
    <p>공시 및 투자자 대응</p>
  </div>

  <div class="employee">
    <h2>🏢 총무 AI</h2>
    <p>자산 및 시설 관리</p>
  </div>
</div>

</body>
</html>
