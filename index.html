<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM.AI.ID - SW AI 사무실</title>
  <style>
    :root {
      --bg-outer: #d8c8b0;
      --bg-panel: #f5efe6;
      --bg-card: #fffdf9;
      --bg-muted: #ebe1d2;
      --bg-floor: #e5d8c5;
      --border-soft: #cbb99f;
      --border-strong: #5c4938;
      --ink-main: #231d18;
      --ink-sub: #594d42;
      --ink-muted: #7c6e60;
      --accent: #3d6b99;
      --accent-dark: #284b6e;
      --ok: #2e7d32;
      --warn: #b26a00;
      --err: #c62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 14px;
      line-height: 1.45;
      color: var(--ink-main);
      background: var(--bg-outer);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 헤더 */
    .topbar {
      background: #efe5d6;
      border-bottom: 2px solid var(--border-soft);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: #3b3026;
      color: #fff8eb;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .office-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .office-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink-main);
    }

    .office-sub {
      font-size: 12px;
      color: var(--ink-sub);
      font-weight: 600;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-main);
    }

    .status-pill.online {
      color: var(--ok);
      border-color: #8bc34a;
      background: #f3faef;
    }

    .btn {
      background: var(--bg-card);
      color: var(--ink-main);
      border: 1.5px solid var(--border-strong);
      border-radius: 6px;
      padding: 6px 11px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.08s ease;
    }

    .btn:hover {
      background: var(--bg-muted);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.active {
      background: var(--border-strong);
      color: #fffdf9;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent-dark);
      color: #ffffff;
    }

    .btn.primary:hover {
      background: var(--accent-dark);
    }

    /* 메인 작업 영역 */
    .main-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 10px;
      padding: 10px;
      min-height: 520px;
    }

    /* 왼쪽: 사무실 맵 패널 */
    .map-panel {
      background: var(--bg-panel);
      border: 2px solid var(--border-soft);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .map-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-soft);
      background: #f0e6d8;
      gap: 8px;
      flex-wrap: wrap;
    }

    .active-staff-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-soft);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-main);
    }

    .dot-green {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2e7d32;
      display: inline-block;
    }

    .view-switch-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .canvas-stage {
      flex: 1;
      position: relative;
      background: #efe4d4;
      min-height: 360px;
    }

    canvas#officeCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    canvas#officeCanvas:active {
      cursor: grabbing;
    }

    .map-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      background: #f0e6d8;
      border-top: 1px solid var(--border-soft);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-sub);
      gap: 8px;
      flex-wrap: wrap;
    }

    /* 오른쪽: 채팅 및 업무 패널 */
    .chat-panel {
      background: var(--bg-panel);
      border: 2px solid var(--border-soft);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .selected-staff-header {
      background: #efe5d6;
      border-bottom: 1.5px solid var(--border-soft);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .staff-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .staff-avatar-box {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: #dce8f5;
      border: 2px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: var(--ink-main);
    }

    .staff-name-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .staff-name-strong {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink-main);
    }

    .role-tag {
      background: #e6dac8;
      border: 1px solid var(--border-soft);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-sub);
    }

    .staff-status-line {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-sub);
      margin-top: 2px;
    }

    .retry-banner {
      background: #fff7e6;
      border-bottom: 1px solid #e0be7e;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: #5c3d00;
      flex-wrap: wrap;
    }

    .chat-log {
      flex: 1;
      padding: 12px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg-card);
      max-height: 360px;
    }

    .msg-item {
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 9px 12px;
      background: #faf5ed;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--ink-main);
    }

    .msg-item.user-msg {
      background: #eaf2fa;
      border-color: #9bbbd9;
      align-self: flex-end;
      max-width: 90%;
    }

    .msg-item.ai-msg {
      background: #fffdf9;
      border-color: var(--border-soft);
      max-width: 95%;
    }

    .msg-meta {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-sub);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .attached-chip {
      display: inline-block;
      margin-top: 6px;
      background: #e5eef7;
      border: 1px solid #8fb3d9;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 700;
      color: #1f466e;
    }

    .composer-box {
      padding: 10px 12px;
      background: #f0e6d8;
      border-top: 1.5px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .composer-label {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--ink-main);
    }

    textarea#messageInput {
      width: 100%;
      min-height: 68px;
      resize: vertical;
      border: 1.5px solid var(--border-strong);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--ink-main);
      background: #ffffff;
    }

    textarea#messageInput:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .composer-left-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hint-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-sub);
    }

    /* 하단 직원 바 */
    .bottom-roster {
      background: #efe5d6;
      border-top: 2px solid var(--border-strong);
      padding: 9px 12px;
      display: flex;
      align-items: stretch;
      gap: 10px;
      overflow-x: auto;
    }

    .roster-card {
      min-width: 195px;
      max-width: 230px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-soft);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 5px;
      flex-shrink: 0;
    }

    .roster-card.selected {
      border: 2px solid var(--accent);
      background: #f4f9ff;
    }

    .roster-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .roster-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-main);
    }

    .badge-state {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e8f5e9;
      color: var(--ok);
      border: 1px solid #a5d6a7;
    }

    .badge-state.busy {
      background: #fff3e0;
      color: var(--warn);
      border-color: #ffcc80;
    }

    .badge-state.error {
      background: #ffebee;
      color: var(--err);
      border-color: #ef9a9a;
    }

    .roster-model {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-sub);
    }

    .roster-progress {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-main);
    }

    .roster-sub {
      font-size: 11.5px;
      color: var(--ink-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .add-staff-card {
      min-width: 96px;
      background: var(--bg-card);
      border: 2px dashed var(--border-strong);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: 800;
      font-size: 13px;
      color: var(--ink-main);
      flex-shrink: 0;
    }

    .add-staff-card:hover {
      background: var(--bg-muted);
    }

    @media (max-width: 960px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-group">
      <div class="brand-badge">TEAM.AI.ID</div>
      <div class="office-title-wrap">
        <div class="office-title">SW AI 사무실</div>
        <div class="office-sub">AI 가상 사무실</div>
      </div>
    </div>

    <div class="header-controls">
      <span id="staffCountBadge" class="status-pill">직원 4명</span>
      <span class="status-pill online">● 온라인</span>
      <button id="simErrorBtn" class="btn" type="button" title="재시도 카운터 및 보존 업무 테스트">오류/재시도 시뮬레이션</button>
      <button id="logoutBtn" class="btn" type="button">로그아웃</button>
    </div>
  </header>

  <main class="main-grid">
    <!-- 왼쪽 사무실 맵 -->
    <section class="map-panel" aria-label="사무실 맵">
      <div class="map-top-bar">
        <div id="activeStaffPill" class="active-staff-badge">
          <span class="dot-green"></span>
          <span>활성 직원 4명</span>
        </div>

        <div class="view-switch-group">
          <button id="floor1Btn" class="btn active" type="button">1층</button>
          <button id="floor2Btn" class="btn" type="button">2층</button>
          <button id="view2dBtn" class="btn" type="button">2D</button>
          <button id="view3dBtn" class="btn active" type="button">3D</button>
        </div>
      </div>

      <div class="canvas-stage">
        <canvas id="officeCanvas"></canvas>
      </div>

      <div class="map-bottom-bar">
        <span>클릭하여 채팅 • 직원 선택 가능</span>
        <span>3D: 드래그 = 회전 • 휠 = 확대/축소 • 클릭 = 직원 선택</span>
      </div>
    </section>

    <!-- 오른쪽 채팅 패널 -->
    <section class="chat-panel" aria-label="직원 대화창">
      <div class="selected-staff-header">
        <div class="staff-profile">
          <div id="selectedAvatar" class="staff-avatar-box">알</div>
          <div>
            <div class="staff-name-row">
              <span id="selectedName" class="staff-name-strong">알렉스</span>
              <span id="selectedRole" class="role-tag">관리자 / 임원</span>
            </div>
            <div id="selectedStatusText" class="staff-status-line">Idle - 도와드릴 준비가 되어 있습니다</div>
          </div>
        </div>
      </div>

      <div id="retryBanner" class="retry-banner">
        <span id="retrySummaryText">재시도 정책: modelUnavailable(5) · timeout(10) · MAX_QUOTA_RETRIES(48) | 보존 업무: 0건</span>
        <button id="reprocessSavedBtn" class="btn" type="button">보존된 업무 재처리</button>
      </div>

      <div id="chatLog" class="chat-log"></div>

      <div class="composer-box">
        <label for="messageInput" class="composer-label">메시지</label>
        <textarea
          id="messageInput"
          placeholder="알렉스에게 메시지를 작성하십시오..."
        ></textarea>
        <input id="fileInput" type="file" style="display: none;" multiple />
        <div class="composer-actions">
          <div class="composer-left-tools">
            <button id="attachFileBtn" class="btn" type="button">+ 파일</button>
            <span id="attachedFileLabel" class="hint-text"></span>
          </div>
          <div class="composer-left-tools">
            <span class="hint-text">입력 전송 • Shift+새 줄 입력</span>
            <button id="sendBtn" class="btn primary" type="button">보내기 →</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 하단 직원 카드 스트립 -->
  <footer id="bottomRoster" class="bottom-roster" aria-label="직원 목록"></footer>

  <script>
    // 재시도 상수 (명시 요구사항 준수)
    const RETRY_LIMITS = {
      modelUnavailable: 5,
      timeout: 10,
      MAX_QUOTA_RETRIES: 48
    };

    const state = {
      floor: 1,         // 1 | 2
      mode3D: true,     // true: 3D 아이소메트릭, false: 2D 평면
      selectedId: 'alex',
      zoom: 1.0,
      panX: 0,
      panY: 0,
      yaw: 0,
      isDragging: false,
      dragStartX: 0,
      dragStartY: 0,
      pendingFiles: [],
      savedTasks: [],   // 보존된 업무 큐
      staff: [
        {
          id: 'alex',
          name: '알렉스',
          role: '관리자 / 임원',

          statusText: 'Idle - 도와드릴 준비가 되어 있습니다',
          badgeLabel: '● 활성',
          floor: 1,
          x: 0.36,
          y: 0.38,
          vx: 0.0004,
          vy: 0.00025,
          bubble: '에이든',
          messages: [
            {
              sender: '알렉스',
              role: '관리자 / 임원',
              time: '14:30',
              text: '추가 확인 요청(간단 회신)\n• 대상 회사 표기: "앱코(ABKO)"가 맞나요? (한글/영문/사업자번호입)\n• 진행 방식 선택: 1 / 2 / 3\n• (옵션) 전문팀 배분 허용: 예 / 아니오\n지금 바로 1번으로 시작하겠습니다. 어떤 방식으로 진행하시겠습니까?'
            }
          ],
          retries: { modelUnavailable: 0, timeout: 0, quota: 0 }
        },
        {
          id: 'aiden',
          name: '에이든',
          role: '전략 및 기획',
          model: 'gpt-5-mini',
          progress: 25,
          statusType: 'busy',
          statusText: '업무 진행 중 - 시장 조사 및 일정 정리',
          badgeLabel: '진행 중',
          floor: 1,
          x: 0.56,
          y: 0.34,
          vx: -0.00035,
          vy: 0.0003,
          bubble: '단테',
          messages: [
            {
              sender: '에이든',
              role: '전략 및 기획',
              time: '14:28',
              text: '1층 기획 구역에서 주요 일정과 핵심 체크포인트를 정리하고 있습니다.'
            }
          ],
          retries: { modelUnavailable: 0, timeout: 0, quota: 0 }
        },
        {
          id: 'dante',
          name: '단테',
          role: '법무 및 검토',
          model: 'gpt-5-mini',
          progress: 10,
          statusType: 'idle',
          statusText: 'Idle - 계약 및 규정 검토 대기 중',
          badgeLabel: '● 활성',
          floor: 1,
          x: 0.45,
          y: 0.62,
          vx: 0.0003,
          vy: -0.00035,
          bubble: '법무 검토',
          messages: [
            {
              sender: '단테',
              role: '법무 및 검토',
              time: '14:25',
              text: '조항별 리스크 및 예외 기준 검토 준비가 완료되었습니다.'
            }
          ],
          retries: { modelUnavailable: 0, timeout: 0, quota: 0 }
        },
        {
          id: 'chloe',
          name: '클로이',
          role: '재무 및 회계',
          model: 'gpt-5-mini',
          progress: 0,
          statusType: 'idle',
          statusText: 'Idle - 비용 및 정산 내역 확인 대기 중',
          badgeLabel: '● 활성',
          floor: 2,
          x: 0.52,
          y: 0.48,
          vx: -0.0003,
          vy: -0.00025,
          bubble: '정산 점검',
          messages: [
            {
              sender: '클로이',
              role: '재무 및 회계',
              time: '14:20',
              text: '2층 재무 구역에서 예산 및 정산 항목을 점검 중입니다.'
            }
          ],
          retries: { modelUnavailable: 0, timeout: 0, quota: 0 }
        }
      ]
    };

    const canvas = document.getElementById('officeCanvas');
    const ctx = canvas.getContext('2d');

    function getNowTime() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function getSelectedStaff() {
      return state.staff.find((s) => s.id === state.selectedId) || state.staff[0];
    }

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(300, Math.floor(rect.width * dpr));
      canvas.height = Math.max(260, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function projectPoint(nx, ny, nz = 0) {
      const rect = canvas.parentElement.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const cx = w * 0.5 + state.panX;
      const cy = h * 0.52 + state.panY;
      const span = Math.min(w, h) * 0.42 * state.zoom;

      const dx = (nx - 0.5) * 2;
      const dy = (ny - 0.5) * 2;

      if (!state.mode3D) {
        return {
          x: cx + dx * span * 1.15,
          y: cy + dy * span * 0.85 - nz * 16 * state.zoom
        };
      }

      const cosY = Math.cos(state.yaw);
      const sinY = Math.sin(state.yaw);
      const rx = dx * cosY - dy * sinY;
      const ry = dx * sinY + dy * cosY;

      const isoX = (rx - ry) * 0.86 * span;
      const isoY = (rx + ry) * 0.46 * span - nz * 18 * state.zoom;

      return { x: cx + isoX, y: cy + isoY };
    }

    function drawRoomBox(x1, y1, x2, y2, fillColor, strokeColor) {
      const p1 = projectPoint(x1, y1, 0);
      const p2 = projectPoint(x2, y1, 0);
      const p3 = projectPoint(x2, y2, 0);
      const p4 = projectPoint(x1, y2, 0);

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.lineTo(p4.x, p4.y);
      ctx.closePath();
      ctx.fillStyle = fillColor;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = strokeColor;
      ctx.stroke();
    }

    function drawDesk(nx, ny) {
      const p = projectPoint(nx, ny, 0);
      const w = 32 * state.zoom;
      const h = 16 * state.zoom;
      ctx.fillStyle = '#c89d6c';
      ctx.strokeStyle = '#5c4938';
      ctx.lineWidth = 1.5;
      ctx.fillRect(p.x - w / 2, p.y - h / 2, w, h);
      ctx.strokeRect(p.x - w / 2, p.y - h / 2, w, h);

      // 모니터 표시
      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(p.x - 6 * state.zoom, p.y - h / 2 - 6 * state.zoom, 12 * state.zoom, 6 * state.zoom);
    }

    function drawCharacter(person) {
      const p = projectPoint(person.x, person.y, 0.25);
      const isSelected = person.id === state.selectedId;
      const r = 11 * state.zoom;

      // 그림자
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + 5 * state.zoom, r * 0.9, r * 0.45, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(35, 29, 24, 0.22)';
      ctx.fill();

      // 몸통
      ctx.beginPath();
      ctx.arc(p.x, p.y - 4 * state.zoom, r, 0, Math.PI * 2);
      ctx.fillStyle = person.statusType === 'error' ? '#e57373' : isSelected ? '#4a90d9' : '#6c8ebf';
      ctx.fill();
      ctx.lineWidth = isSelected ? 2.5 : 1.5;
      ctx.strokeStyle = '#231d18';
      ctx.stroke();

      // 이름표 (가독성 강화)
      const label = person.name;
      ctx.font = `800 ${Math.max(12, Math.round(12.5 * state.zoom))}px "Malgun Gothic", sans-serif`;
      const tw = ctx.measureText(label).width;
      const boxW = tw + 12;
      const boxH = 20;
      const lx = p.x - boxW / 2;
      const ly = p.y - r * 2 - 22;

      ctx.fillStyle = isSelected ? '#231d18' : '#fffdf9';
      ctx.strokeStyle = '#231d18';
      ctx.lineWidth = 1.5;
      ctx.fillRect(lx, ly, boxW, boxH);
      ctx.strokeRect(lx, ly, boxW, boxH);

      ctx.fillStyle = isSelected ? '#ffffff' : '#231d18';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, p.x, ly + boxH / 2 + 0.5);
    }

    function updateCharacters() {
      state.staff.forEach((person) => {
        if (person.floor !== state.floor) return;
        const speedFactor = person.statusType === 'busy' ? 1.35 : 0.75;
        person.x += person.vx * speedFactor;
        person.y += person.vy * speedFactor;

        if (person.x < 0.22 || person.x > 0.78) person.vx *= -1;
        if (person.y < 0.24 || person.y > 0.76) person.vy *= -1;

        if (person.statusType === 'busy' && Math.random() < 0.01) {
          person.progress = Math.min(100, person.progress + 5);
        }
      });
    }

    function renderCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);

      // 외곽 바닥
      drawRoomBox(0.15, 0.16, 0.85, 0.84, '#f7f1e6', '#5c4938');

      if (state.floor === 1) {
        drawRoomBox(0.18, 0.20, 0.48, 0.48, '#efe4d2', '#7c6855');
        drawRoomBox(0.50, 0.20, 0.82, 0.48, '#e8dcc8', '#7c6855');
        drawRoomBox(0.18, 0.52, 0.82, 0.80, '#f2e8d8', '#7c6855');
        drawDesk(0.32, 0.34);
        drawDesk(0.66, 0.34);
        drawDesk(0.42, 0.66);
        drawDesk(0.64, 0.66);
      } else {
        drawRoomBox(0.18, 0.20, 0.82, 0.46, '#e7dccb', '#7c6855');
        drawRoomBox(0.18, 0.50, 0.82, 0.80, '#f1e6d5', '#7c6855');
        drawDesk(0.36, 0.33);
        drawDesk(0.64, 0.33);
        drawDesk(0.50, 0.65);
      }

      // 층 표시 워터마크
      ctx.font = '800 13px "Malgun Gothic", sans-serif';
      ctx.fillStyle = '#594d42';
      ctx.textAlign = 'left';
      ctx.fillText(
        `${state.floor}층 사무실 (${state.mode3D ? '3D 뷰' : '2D 뷰'})`,
        14,
        24
      );

      state.staff
        .filter((s) => s.floor === state.floor)
        .forEach((person) => drawCharacter(person));
    }

    function renderHeaderAndRetry() {
      const totalStaff = state.staff.length;
      document.getElementById('staffCountBadge').textContent = `직원 ${totalStaff}명`;
      document.getElementById('activeStaffPill').innerHTML =
        `<span class="dot-green"></span><span>활성 직원 ${totalStaff}명</span>`;

      const sel = getSelectedStaff();
      document.getElementById('retrySummaryText').textContent =
        `재시도 카운터(${sel.name}): modelUnavailable ${sel.retries.modelUnavailable}/${RETRY_LIMITS.modelUnavailable} · ` +
        `timeout ${sel.retries.timeout}/${RETRY_LIMITS.timeout} · ` +
        `quota ${sel.retries.quota}/${RETRY_LIMITS.MAX_QUOTA_RETRIES} | 보존 업무: ${state.savedTasks.length}건`;
    }

    function renderChatPanel() {
      const sel = getSelectedStaff();
      document.getElementById('selectedAvatar').textContent = sel.name.slice(0, 1);
      document.getElementById('selectedName').textContent = sel.name;
      document.getElementById('selectedRole').textContent = sel.role;
      document.getElementById('selectedStatusText').textContent = sel.statusText;
      document.getElementById('messageInput').placeholder = `${sel.name}에게 메시지를 작성하십시오...`;

      const logEl = document.getElementById('chatLog');
      logEl.innerHTML = '';

      sel.messages.forEach((m) => {
        const div = document.createElement('div');
        div.className = `msg-item ${m.sender === '나' ? 'user-msg' : 'ai-msg'}`;

        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        meta.innerHTML = `<span>${m.sender}${m.role ? ' · ' + m.role : ''}</span><span>${m.time}</span>`;
        div.appendChild(meta);

        const body = document.createElement('div');
        body.style.whiteSpace = 'pre-line';
        body.textContent = m.text;
        div.appendChild(body);

        if (m.files && m.files.length > 0) {
          m.files.forEach((fname) => {
            const chip = document.createElement('span');
            chip.className = 'attached-chip';
            chip.textContent = `첨부: ${fname}`;
            div.appendChild(chip);
          });
        }

        logEl.appendChild(div);
      });

      logEl.scrollTop = logEl.scrollHeight;
    }

    function renderRoster() {
      const rosterEl = document.getElementById('bottomRoster');
      rosterEl.innerHTML = '';

      state.staff.forEach((person) => {
        const card = document.createElement('div');
        card.className = `roster-card ${person.id === state.selectedId ? 'selected' : ''}`;
        card.addEventListener('click', () => {
          state.selectedId = person.id;
          state.floor = person.floor;
          syncFloorButtons();
          renderAll();
        });

        const badgeClass =
          person.statusType === 'error'
            ? 'badge-state error'
            : person.statusType === 'busy'
            ? 'badge-state busy'
            : 'badge-state';

        card.innerHTML = `
          <div class="roster-top">
            <span class="roster-name">${person.name}</span>
            <span class="${badgeClass}">${person.badgeLabel}</span>
          </div>
          <div class="roster-model">${person.model} · ${person.floor}층</div>
          <div class="roster-progress">진행률 ${person.progress}%</div>
          <div class="roster-sub">${person.role}</div>
        `;
        rosterEl.appendChild(card);
      });

      const addCard = document.createElement('button');
      addCard.type = 'button';
      addCard.className = 'add-staff-card';
      addCard.innerHTML = `<span style="font-size:20px;line-height:1;">+</span><span>직원</span>`;
      addCard.addEventListener('click', () => {
        const idx = state.staff.length + 1;
        const newId = `staff_${Date.now()}`;
        const newPerson = {
          id: newId,
          name: `직원${idx}`,
          role: '업무 지원',
          model: 'gpt-5-mini',
          progress: 0,
          statusType: 'idle',
          statusText: 'Idle - 도와드릴 준비가 되어 있습니다',
          badgeLabel: '● 활성',
          floor: state.floor,
          x: 0.3 + ((idx * 0.11) % 0.42),
          y: 0.35 + ((idx * 0.09) % 0.35),
          vx: 0.0003,
          vy: -0.00025,
          bubble: '신규',
          messages: [
            {
              sender: `직원${idx}`,
              role: '업무 지원',
              time: getNowTime(),
              text: `${state.floor}층에 배치되었습니다. 지시하실 업무를 입력해 주세요.`
            }
          ],
          retries: { modelUnavailable: 0, timeout: 0, quota: 0 }
        };
        state.staff.push(newPerson);
        state.selectedId = newId;
        renderAll();
      });

      rosterEl.appendChild(addCard);
    }

    function syncFloorButtons() {
      document.getElementById('floor1Btn').classList.toggle('active', state.floor === 1);
      document.getElementById('floor2Btn').classList.toggle('active', state.floor === 2);
      document.getElementById('view2dBtn').classList.toggle('active', !state.mode3D);
      document.getElementById('view3dBtn').classList.toggle('active', state.mode3D);
    }

    function renderAll() {
      renderHeaderAndRetry();
      renderChatPanel();
      renderRoster();
      renderCanvas();
    }

    function sendMessage() {
      const inputEl = document.getElementById('messageInput');
      const text = inputEl.value.trim();
      const files = state.pendingFiles.map((f) => f.name);
      if (!text && files.length === 0) return;

      const sel = getSelectedStaff();
      const now = getNowTime();

      sel.messages.push({
        sender: '나',
        role: '',
        time: now,
        text: text || '(첨부 파일 전송)',
        files
      });

      sel.statusType = 'busy';
      sel.badgeLabel = '진행 중';
      sel.statusText = '요청 처리 중...';

      // 재시도 시뮬레이션: modelUnavailable(5), timeout(10), MAX_QUOTA_RETRIES(48)
      if (text.includes('[err:model]')) {
        sel.retries.modelUnavailable = Math.min(
          RETRY_LIMITS.modelUnavailable,
          sel.retries.modelUnavailable + 1
        );
        state.savedTasks.push({ staffId: sel.id, text, files, reason: 'modelUnavailable' });
        sel.statusType = 'error';
        sel.badgeLabel = '재시도';
        sel.statusText = `모델 일시 불가 재시도 (${sel.retries.modelUnavailable}/${RETRY_LIMITS.modelUnavailable}) - 업무 보존됨`;
        sel.messages.push({
          sender: sel.name,
          role: sel.role,
          time: getNowTime(),
          text: `modelUnavailable 감지(${sel.retries.modelUnavailable}/${RETRY_LIMITS.modelUnavailable}). 업무가 보존 큐에 저장되었습니다.`
        });
      } else if (text.includes('[err:timeout]')) {
        sel.retries.timeout = Math.min(RETRY_LIMITS.timeout, sel.retries.timeout + 1);
        state.savedTasks.push({ staffId: sel.id, text, files, reason: 'timeout' });
        sel.statusType = 'error';
        sel.badgeLabel = '재시도';
        sel.statusText = `응답 시간 초과 재시도 (${sel.retries.timeout}/${RETRY_LIMITS.timeout}) - 업무 보존됨`;
        sel.messages.push({
          sender: sel.name,
          role: sel.role,
          time: getNowTime(),
          text: `timeout 감지(${sel.retries.timeout}/${RETRY_LIMITS.timeout}). 업무가 보존 큐에 저장되었습니다.`
        });
      } else if (text.includes('[err:quota]')) {
        sel.retries.quota = Math.min(RETRY_LIMITS.MAX_QUOTA_RETRIES, sel.retries.quota + 1);
        state.savedTasks.push({ staffId: sel.id, text, files, reason: 'quota' });
        sel.statusType = 'error';
        sel.badgeLabel = '재시도';
        sel.statusText = `할당량 재시도 (${sel.retries.quota}/${RETRY_LIMITS.MAX_QUOTA_RETRIES}) - 업무 보존됨`;
        sel.messages.push({
          sender: sel.name,
          role: sel.role,
          time: getNowTime(),
          text: `quota 재시도 카운트(${sel.retries.quota}/${RETRY_LIMITS.MAX_QUOTA_RETRIES}). 업무가 보존 큐에 저장되었습니다.`
        });
      } else {
        sel.progress = Math.min(100, sel.progress + 10);
        sel.statusType = 'idle';
        sel.badgeLabel = '● 활성';
        sel.statusText = 'Idle - 도와드릴 준비가 되어 있습니다';
        sel.messages.push({
          sender: sel.name,
          role: sel.role,
          time: getNowTime(),
          text: `"${text || files.join(', ')}" 요청을 접수하여 반영했습니다.`
        });
      }

      inputEl.value = '';
      state.pendingFiles = [];
      document.getElementById('attachedFileLabel').textContent = '';
      renderAll();
    }

    // 수동 "보존된 업무 재처리" 시 재시도 카운터 초기화
    document.getElementById('reprocessSavedBtn').addEventListener('click', () => {
      state.staff.forEach((s) => {
        s.retries.modelUnavailable = 0;
        s.retries.timeout = 0;
        s.retries.quota = 0;
        if (s.statusType === 'error') {
          s.statusType = 'idle';
          s.badgeLabel = '● 활성';
          s.statusText = 'Idle - 도와드릴 준비가 되어 있습니다';
        }
      });

      const count = state.savedTasks.length;
      state.savedTasks = [];

      const sel = getSelectedStaff();
      sel.messages.push({
        sender: '시스템',
        role: '재처리 실행',
        time: getNowTime(),
        text: `보존된 업무 ${count}건을 재처리하고 모든 재시도 카운터(modelUnavailable/timeout/quota)를 0으로 초기화했습니다.`
      });
      renderAll();
    });

    document.getElementById('simErrorBtn').addEventListener('click', () => {
      const sel = getSelectedStaff();
      sel.retries.modelUnavailable = Math.min(RETRY_LIMITS.modelUnavailable, sel.retries.modelUnavailable + 1);
      sel.retries.timeout = Math.min(RETRY_LIMITS.timeout, sel.retries.timeout + 1);
      sel.retries.quota = Math.min(RETRY_LIMITS.MAX_QUOTA_RETRIES, sel.retries.quota + 1);
      state.savedTasks.push({
        staffId: sel.id,
        text: '샘플 보존 업무',
        files: [],
        reason: 'simulation'
      });
      sel.statusType = 'error';
      sel.badgeLabel = '재시도';
      sel.statusText = '재시도 대기 중 - 보존된 업무 재처리 가능';
      renderAll();
    });

    document.getElementById('floor1Btn').addEventListener('click', () => {
      state.floor = 1;
      syncFloorButtons();
      renderCanvas();
    });

    document.getElementById('floor2Btn').addEventListener('click', () => {
      state.floor = 2;
      syncFloorButtons();
      renderCanvas();
    });

    document.getElementById('view2dBtn').addEventListener('click', () => {
      state.mode3D = false;
      syncFloorButtons();
      renderCanvas();
    });

    document.getElementById('view3dBtn').addEventListener('click', () => {
      state.mode3D = true;
      syncFloorButtons();
      renderCanvas();
    });

    document.getElementById('attachFileBtn').addEventListener('click', () => {
      document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const list = Array.from(e.target.files || []);
      state.pendingFiles = list;
      document.getElementById('attachedFileLabel').textContent =
        list.length > 0 ? list.map((f) => f.name).join(', ') : '';
    });

    document.getElementById('sendBtn').addEventListener('click', sendMessage);

    document.getElementById('messageInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      alert('세션 로그아웃 요청이 처리되었습니다.');
    });

    // 캔버스 마우스 드래그/줌/선택
    canvas.addEventListener('mousedown', (e) => {
      state.isDragging = true;
      state.dragStartX = e.clientX;
      state.dragStartY = e.clientY;
    });

    window.addEventListener('mouseup', () => {
      state.isDragging = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!state.isDragging) return;
      const dx = e.clientX - state.dragStartX;
      const dy = e.clientY - state.dragStartY;
      state.dragStartX = e.clientX;
      state.dragStartY = e.clientY;
      if (state.mode3D) {
        state.yaw += dx * 0.008;
      }
      state.panX += dx * 0.4;
      state.panY += dy * 0.4;
      renderCanvas();
    });

    canvas.addEventListener(
      'wheel',
      (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.1 : -0.1;
        state.zoom = Math.max(0.65, Math.min(1.65, Number((state.zoom + delta).toFixed(2))));
        renderCanvas();
      },
      { passive: false }
    );

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      const hit = state.staff
        .filter((s) => s.floor === state.floor)
        .find((person) => {
          const p = projectPoint(person.x, person.y, 0.25);
          const dist = Math.hypot(mx - p.x, my - (p.y - 4 * state.zoom));
          return dist <= 22 * state.zoom;
        });

      if (hit) {
        state.selectedId = hit.id;
        renderAll();
      }
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
      renderCanvas();
    });

    resizeCanvas();
    renderAll();

    setInterval(() => {
      updateCharacters();
      renderCanvas();
    }, 60);
  </script>
</body>
</html>
