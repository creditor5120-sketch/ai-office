<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY AI OFFICE</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial;padding:20px}
h1{color:#60a5fa}
.card{background:#243247;padding:20px;margin:12px 0;border-radius:12px}
button{background:#2563eb;color:white;border:0;padding:13px;border-radius:8px;width:100%;margin-top:10px}
textarea{width:100%;height:100px;box-sizing:border-box;padding:12px;border-radius:8px}
#workspace{display:none}
</style>
</head>
<body>

<h1>MY AI OFFICE</h1>
<p>나만의 AI 업무실</p>

<h2>AI 직원</h2>

<div class="card">
<h3>⚖️ 법무 AI</h3>
<p>계약·법률·지식재산 검토</p>
<button onclick="openOffice('법무 AI')">업무실 입장</button>
</div>

<div class="card">
<h3>📊 IR AI</h3>
<p>공시·투자자 대응</p>
<button onclick="openOffice('IR AI')">업무실 입장</button>
</div>

<div class="card">
<h3>🏢 총무 AI</h3>
<p>자산·구매·시설 관리</p>
<button onclick="openOffice('총무 AI')">업무실 입장</button>
</div>

<div class="card">
<h3>👔 대표 AI</h3>
<p>업무 총괄 및 관리</p>
<button onclick="openOffice('대표 AI')">업무실 입장</button>
</div>

<div id="workspace" class="card">
<h2 id="employee"></h2>
<p>업무 지시 내용을 입력하세요.</p>
<textarea id="request" placeholder="업무 내용을 입력하세요."></textarea>
<button onclick="sendTask()">업무 지시하기</button>
<p id="response"></p>
<button onclick="closeOffice()">오피스 나가기</button>
</div>

<script>
function openOffice(name){
document.getElementById('workspace').style.display='block';
document.getElementById('employee').innerText=name;
document.getElementById('response').innerText='';
document.getElementById('workspace').scrollIntoView();
}

function sendTask(){
const task=document.getElementById('request').value;
if(!task.trim()){
alert('업무 내용을 입력하세요.');
return;
}
document.getElementById('response').innerText=
'업무 지시가 입력되었습니다. 실제 AI 응답을 위한 서버 연결이 필요합니다.';
}

function closeOffice(){
document.getElementById('workspace').style.display='none';
}
</script>

</body>
</html>
