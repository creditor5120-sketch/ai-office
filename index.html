
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SW AI OFFICE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">

<style>
/* 공통 화면 크기 및 레이아웃 */
* {
  box-sizing: border-box;
}

body {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: clamp(12px, 3vw, 28px);
  font-family: 'NanumSquare', sans-serif;
}

.card {
  min-width: 0;
  overflow-wrap: anywhere;
}

textarea {
  min-height: 150px;
  resize: vertical;
  font-size: 16px;
}

button {
  min-height: 44px;
  font-size: 15px;
  touch-action: manipulation;
}

#response,
#deliverableContent {
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* 결과물 도구 버튼 */
#deliverableCard > div:first-child {
  flex-wrap: wrap;
}

#deliverableCard > div:first-child button {
  width: auto;
  flex: 0 1 auto;
}

/* 아이패드 및 태블릿 */
@media (max-width: 1024px) {
  body {
    padding: 18px;
  }

  .card {
    padding: 18px;
  }
}

/* 스마트폰 및 좁은 화면 */
@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  h1 {
    font-size: 25px;
  }

  .card {
    padding: 14px;
    margin: 10px 0;
  }

  .card h2 {
    font-size: 20px;
  }

  .card h3 {
    font-size: 17px;
  }

  #deliverableCard > div:first-child {
    flex-direction: column;
    align-items: stretch !important;
  }

  #deliverableCard > div:first-child button {
    width: 100%;
  }

    textarea {
    min-height: 130px;
  }
}

html,
body,
button,
input,
select,
textarea {
}

body {
  margin: 0;
  background: #101827;
  color: white;
  padding: 20px;
}
  
h1 {
  color: #60a5fa;
}

.card {
  background: #243247;
  padding: 20px;
  margin: 12px 0;
  border-radius: 12px;
}

button {
  background: #2563eb;
  color: white;
  border: 0;
  padding: 13px;
  border-radius: 8px;
  width: 100%;
  margin-top: 10px;
  box-sizing: border-box;
  cursor: pointer;
}

button:disabled {
  background: #64748b;
  cursor: wait;
}

textarea {
  width: 100%;
  height: 150px;
  box-sizing: border-box;
  padding: 12px;
  border-radius: 8px;
  font: inherit;
}

#response {
  white-space: pre-wrap;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

#response h1,
#response h2,
#response h3 {
  color: #93c5fd;
}

#response hr {
  border: 0;
  border-top: 1px solid #64748b;
  margin: 18px 0;
}

.small {
  color: #cbd5e1;
  font-size: 14px;
}

.role {
  color: #93c5fd;
  font-size: 15px;
}
</style>
</head>

<body>

<h1 style="font-weight: 900; font-size: 42px;">SW AI OFFICE</h1>

<div class="card">
  <h2>알렉스 본부장 업무실</h2>

  <p class="role">
    COO · 조직 운영 및 업무 실행 총괄
  </p>

  <p class="small">
    모든 업무는 본부장에게 지시하세요.
    본부장은 업무를 분석하고 담당 부서와 전문 직원을 배정합니다.
    부서 간 협업과 진행 상황을 관리하고 결과물을 검수한 후 사용자에게 보고합니다.
  </p>

  <textarea
    id="request"
    placeholder="본부장에게 업무를 지시하세요."
  ></textarea>

  <button id="sendButton">
    본부장에게 업무 지시
  </button>
 <button
  id="retryTaskButton"
  type="button"
  style="display:none; background:#059669;"
>
  보존된 업무 재처리
</button>
</div>


<div class="card">
  <h3>업무 처리 결과</h3>
  <div id="response" class="report-content">
    아직 접수된 업무가 없습니다.
  </div>
</div>

<div class="card" id="deliverableCard" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
    <h3>실제 작성 결과물</h3>
    <button id="copyDeliverable" type="button">
      전체 복사
    </button>
<button id="downloadWord" type="button">Word 다운로드</button>
<button id="downloadPdf" type="button">PDF 다운로드</button>
  </div>
  <div id="deliverableContent" class="report-content"></div>
</div>


<script type="module">

import employeeDirectory from './employees.js';

// 기존 CEO 내부 ID는 직원 데이터 연결을 위해 유지
// 화면과 업무상 역할은 본부장으로 변경
const headOfOffice = employeeDirectory.find(
  item => item.id === 'COO'
);

const responseBox = document.getElementById('response');
const sendButton = document.getElementById('sendButton');
const requestBox = document.getElementById('request');
const retryTaskButton = document.getElementById('retryTaskButton');
 // 업무 중복 실행 방지 잠금
let isTaskRunning = false;
// Gemini API 오류로 중단된 업무 지시 복원
const PENDING_TASK_KEY = 'swAIOfficePendingTask';

try {
  const savedTask = JSON.parse(
    localStorage.getItem(PENDING_TASK_KEY) || 'null'
  );

  if (savedTask && savedTask.task) {
   savedTask.taskId = savedTask.taskId || crypto.randomUUID();
savedTask.idempotencyKey = savedTask.idempotencyKey || savedTask.taskId;

localStorage.setItem(
  PENDING_TASK_KEY,
  JSON.stringify(savedTask)
);
   retryTaskButton.style.display = 'block';
    requestBox.value = savedTask.task;

    responseBox.textContent =
      '이전에 접수했으나 처리가 완료되지 않은 업무가 보존되어 있어. ' +
      '기존 업무 지시를 확인하고 다시 처리할 수 있어.';
  }
} catch (error) {
  console.error('미처리 업무 복원 실패:', error);
}
 
// Markdown 출력 처리
function renderMarkdown(text) {

  const escaped = String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // AI 응답의 Markdown 앞에 붙은 불필요한 역슬래시 제거
  const normalized = escaped.replace(
    /\\(?=(?:#{1,6}\s|\*\*|__|[-*]\s|---))/g,
    ''
  );

  return normalized
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>')
    .replace(/^# (.*)$/gm, '<h1>$1</h1>')
    .replace(/^---$/gm, '<hr>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

// 업무 지시
async function sendTask(reusePending = false) {
   let pending = null;

  if (reusePending) {
    try {
      pending = JSON.parse(
        localStorage.getItem(PENDING_TASK_KEY) || 'null'
      );
    } catch (error) {
      pending = null;
    }
  }

  const taskId = pending?.taskId || crypto.randomUUID();
  const idempotencyKey = pending?.idempotencyKey || taskId;
   if (isTaskRunning) {
    responseBox.textContent = '이미 업무를 처리하고 있습니다. 중복 실행은 차단했습니다.';
    return;
  }

  const task = requestBox.value.trim();

  if (!task) {
    alert('업무 지시 내용을 입력해주세요.');
    return;
  }

  if (!headOfOffice) {
    responseBox.textContent =
      '본부장 정보를 찾을 수 없습니다. 직원 데이터 설정을 확인해 주세요.';
    return;
  }
  // 업무 중복 실행 방지
  isTaskRunning = true;
  sendButton.disabled = true;
  retryTaskButton.disabled = true;
 
   responseBox.textContent =
    '업무 접수 및 부서 배분 준비 중...';

  try {
   
    // 본부장 AI 호출 전에 업무 지시 원문 보존
    localStorage.setItem(
  PENDING_TASK_KEY,
  JSON.stringify({
    task: task,
    taskId: taskId,
    idempotencyKey: idempotencyKey,
    status: 'WAITING_FOR_PROCESSING',
    savedAt: new Date().toISOString()
  })
);
   
    const response = await fetch(
      'https://ai-office-api.creditor5120.workers.dev/',
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({

          task,
           taskId,
           idempotencyKey,

          employee: headOfOffice.name,
          employeeId: headOfOffice.id,

          department: '본부장실',
          position: '본부장',

          instruction:
            '너는 SW AI OFFICE의 본부장이다. ' +
            '사용자가 최종 의사결정권자이며 너는 대표이사가 아니다. ' +
            '사용자의 업무 지시를 직접 분석하고 담당 부서와 전문 직원을 배정한다. ' +
            '부서 간 협업, 우선순위, 일정, 진행 상황을 관리하고 결과물을 통합 검수한다. ' +
            '중요한 의사결정과 외부 실행은 사용자 승인을 받아야 한다. ' +
            '실제로 수행하지 않은 업무를 완료했다고 보고하지 않는다. ' +
            '실제 근거와 결과물이 없는 경우 미완료 또는 추가 확인 필요로 표시한다. ' +
            (headOfOffice.instruction || ''),

          employees: employeeDirectory

        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || '서버 연결 오류'
      );
    }

    
const fullReply = data.reply || '응답 내용이 없습니다.';

// 본부장 최종 보고서 표시
responseBox.innerHTML = `
  <div class="report-content">
    ${renderMarkdown(fullReply)}
  </div>
`;

// Worker에서 별도로 전달한 실제 결과물 가져오기
const deliverableCard = document.getElementById('deliverableCard');
const deliverableContent = document.getElementById('deliverableContent');
const copyDeliverable = document.getElementById('copyDeliverable');

const deliverables = Array.isArray(data.deliverables)
  ? data.deliverables
  : [];

// 결과물 통합
const deliverableText = deliverables
  .map((item, index) => {
    const title = item.title || `결과물 ${index + 1}`;
    return `# ${title}\n\n${item.content || ''}`;
  })
  .join('\n\n---\n\n');

// 결과물 카드 표시
if (deliverableText.trim()) {
  deliverableCard.style.display = 'block';
  deliverableContent.innerHTML = renderMarkdown(deliverableText);

  copyDeliverable.onclick = async () => {
    await navigator.clipboard.writeText(deliverableText);
    copyDeliverable.textContent = '복사 완료';
  };
} else {
  deliverableCard.style.display = 'none';
  deliverableContent.innerHTML = '';
}
// 마지막 업무 결과 자동 저장
localStorage.setItem(
  'myAIOfficeLastResult',
  JSON.stringify({
    reply: fullReply,
    deliverables: deliverables,
    savedAt: new Date().toISOString()
  })
);    
   // 결과 저장이 완료된 경우에만 미처리 업무 기록 삭제
localStorage.removeItem(PENDING_TASK_KEY);
   retryTaskButton.style.display = 'none';

   } catch (error) {

  // 오류가 발생해도 원래 업무 지시는 보존
  let savedTask = null;

try {
  savedTask = JSON.parse(
    localStorage.getItem(PENDING_TASK_KEY) || 'null'
  );
} catch (storageError) {
  console.error('보존된 업무 복원 실패:', storageError);
}

  if (savedTask) {

    const isQuotaError =
      /429|RESOURCE_EXHAUSTED|quota|rate.?limit/i.test(
        error.message
      );

    savedTask.status = isQuotaError
      ? 'WAITING_FOR_API_QUOTA'
      : 'PROCESSING_FAILED';

    savedTask.lastError = error.message;
    savedTask.updatedAt = new Date().toISOString();

    localStorage.setItem(
      PENDING_TASK_KEY,
      JSON.stringify(savedTask)
    );
   retryTaskButton.style.display = 'block';

    responseBox.textContent = isQuotaError
      ? 'Gemini API 사용량 한도로 처리가 중단됐어. 업무 지시는 보존했어. 사용량 한도가 복구된 후 다시 처리할 수 있어.'
      : '업무 처리 중 오류가 발생했어. 업무 지시는 보존했어. 오류를 확인한 후 다시 처리할 수 있어.\\n\\n오류 내용: ' + error.message;

  } else {

    responseBox.textContent =
      '오류가 발생했어: ' + error.message;

  }

}
   
finally {
  isTaskRunning = false;
  sendButton.disabled = false;
  retryTaskButton.disabled = false;
  sendButton.textContent = '본부장에게 업무 지시';
}
}
 
sendButton.addEventListener('click', sendTask);
// 보존된 업무 재처리
retryTaskButton.addEventListener('click', () => {
  const savedTask = JSON.parse(
    localStorage.getItem(PENDING_TASK_KEY) || 'null'
  );

  if (!savedTask || !savedTask.task) {
    responseBox.textContent = '재처리할 업무가 없습니다.';
    retryTaskButton.style.display = 'none';
    return;
  }

  requestBox.value = savedTask.task;
  sendTask(true);
});
 
</script>

<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>

<script>
document.getElementById('downloadWord').addEventListener('click', async () => {
  const content = document.getElementById('deliverableContent');
  const text = content.innerText.trim();

  if (!text) {
    alert('다운로드할 결과물이 없습니다.');
    return;
  }

  if (!window.docx) {
    alert('Word 변환 라이브러리를 불러오지 못했어. 인터넷 연결을 확인해 줘.');
    return;
  }

  const { Document, Paragraph, TextRun, Packer } = window.docx;

  const paragraphs = text.split('\n').map(line =>
    new Paragraph({
      children: [new TextRun(line)]
    })
  );

  const doc = new Document({
    sections: [{
      children: paragraphs
    }]
  });

  const blob = await Packer.toBlob(doc);
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.href = url;
  link.download = 'SW_AI_OFFICE_결과물.docx';
  link.click();

  URL.revokeObjectURL(url);
});

document.getElementById('downloadPdf').addEventListener('click', () => {
  const content = document.getElementById('deliverableContent');

  if (!content.innerText.trim()) {
    alert('다운로드할 결과물이 없습니다.');
    return;
  }

  const printWindow = window.open('', '_blank');

  if (!printWindow) {
    alert('팝업이 차단됐어. 팝업을 허용해 줘.');
    return;
  }

  printWindow.document.write(`
    <!DOCTYPE html>
    <html lang="ko">
    <head>
      <meta charset="UTF-8">
      <title>SW AI OFFICE 결과물</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          line-height: 1.7;
          padding: 35px;
          color: #222;
        }
        h1, h2, h3 {
          page-break-after: avoid;
        }
        p {
          margin: 6px 0;
        }
        @page {
          size: A4;
          margin: 20mm;
        }
      </style>
    </head>
    <body>
      ${content.innerHTML}
    </body>
    </html>
  `);

  printWindow.document.close();
  printWindow.onload = () => {
    printWindow.print();
  };
});

  // 마지막 업무 결과 자동 복원
(function restoreLastResult() {
  const saved = localStorage.getItem('myAIOfficeLastResult');

  if (!saved) return;

  try {
    const data = JSON.parse(saved);

    const deliverableCard = document.getElementById('deliverableCard');
    const deliverableContent = document.getElementById('deliverableContent');
    const copyDeliverable = document.getElementById('copyDeliverable');

    if (data.reply && responseBox) {
      responseBox.innerHTML = `
        <div class="report-content">
          ${renderMarkdown(data.reply)}
        </div>
      `;
    }

    const deliverables = Array.isArray(data.deliverables)
      ? data.deliverables
      : [];

    const deliverableText = deliverables
      .map((item, index) => {
        const title = item.title || `결과물 ${index + 1}`;
        return `# ${title}\n\n${item.content || ''}`;
      })
      .join('\n\n---\n\n');

    if (deliverableText.trim() && deliverableCard) {
      deliverableCard.style.display = 'block';
      deliverableContent.innerHTML = renderMarkdown(deliverableText);

      copyDeliverable.onclick = async () => {
        await navigator.clipboard.writeText(deliverableText);
        copyDeliverable.textContent = '복사 완료';
      };
    }

  } catch (error) {
    console.error('저장된 업무 결과 복원 실패:', error);
  }
})();
  
</script>
</body>
</html>
