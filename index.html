<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SW AI 사무실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #ede4d3;
  color: #2c241b;
  font-family: 'NanumSquare', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 상단 바 */
.top-bar {
  height: 54px;
  background: #f6efe2;
  border-bottom: 1px solid #d5c6ad;
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-shrink: 0;
}

.top-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-tag {
  background: #fffaf0;
  border: 1px solid #d5c6ad;
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.4px;
  color: #3a3025;
}

.office-title-group {
  display: flex;
  flex-direction: column;
}

.office-title {
  font-size: 15px;
  font-weight: 900;
  line-height: 1.15;
}

.office-sub {
  font-size: 11px;
  color: #7b6c58;
  line-height: 1.15;
}

.top-right {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.info-pill {
  background: #fffaf0;
  border: 1px solid #d5c6ad;
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 700;
  color: #4a3e30;
}

.top-btn {
  background: #fffaf0;
  border: 1px solid #d5c6ad;
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 12px;
  font-weight: 700;
  color: #3a3025;
  cursor: pointer;
}

.top-btn.active {
  background: #8c5a2b;
  color: #fff;
  border-color: #8c5a2b;
}

/* 메인 분할 */
.main-grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1.54fr 1fr;
  gap: 10px;
  padding: 10px;
}

body.detail-open .office-stage {
  display: none;
}

body.detail-open .main-grid {
  grid-template-columns: 1fr;
}

.office-stage {
  position: relative;
  background: #e5dbc7;
  border: 1px solid #cbbba0;
  border-radius: 8px;
  overflow: hidden;
  min-height: 0;
}

#officeCanvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: none;
}

#officeCanvas:active {
  cursor: grabbing;
}

.active-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(255, 250, 240, 0.96);
  border: 1px solid #cbbba0;
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 800;
  color: #24724a;
  pointer-events: none;
}

.stage-bottom-bar {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}

.stage-hints {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  pointer-events: auto;
}

.hint-chip {
  background: rgba(255, 250, 240, 0.95);
  border: 1px solid #cbbba0;
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 11px;
  font-weight: 700;
  color: #4a3e30;
}

.view-group {
  display: flex;
  align-items: center;
  gap: 3px;
  background: rgba(255, 250, 240, 0.96);
  border: 1px solid #cbbba0;
  border-radius: 6px;
  padding: 3px;
  pointer-events: auto;
}

.view-btn {
  background: transparent;
  border: 0;
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 800;
  color: #4a3e30;
  cursor: pointer;
}

.view-btn.active {
  background: #3a3025;
  color: #fff;
}

/* 우측 대화 및 업무 패널 */
.chat-panel {
  background: #f6efe2;
  border: 1px solid #cbbba0;
  border-radius: 8px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
}

.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid #dfd3bc;
}

.agent-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

.agent-avatar {
  width: 42px;
  height: 48px;
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  background: linear-gradient(145deg, #dce7ed, #b9c9d5);
  border: 1px solid #9cabb8;
  color: transparent;
  font-size: 0;
  flex-shrink: 0;
}
.agent-avatar::before {
  content: "";
  position: absolute;
  width: 18px;
  height: 21px;
  left: 11px;
  top: 7px;
  border-radius: 48% 48% 44% 44%;
  background: #e7b995;
  box-shadow: inset 0 3px 0 #302a29;
  z-index: 1;
}
.agent-avatar::after {
  content: "";
  position: absolute;
  width: 32px;
  height: 25px;
  left: 4px;
  bottom: -4px;
  border-radius: 11px 11px 3px 3px;
  background: #2f4b6e;
}

.agent-title-line {
  display: flex;
  align-items: center;
  gap: 6px;
}

.agent-name {
  font-size: 15px;
  font-weight: 900;
}

.agent-role-badge {
  background: #ebe0ca;
  color: #5b4c3b;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 4px;
}

.agent-status-line {
  font-size: 11px;
  color: #7b6c58;
  margin-top: 2px;
}

.principle-toggle {
  font-size: 11px;
  color: #675845;
  background: #fffaf0;
  border: 1px solid #d5c6ad;
  border-radius: 5px;
  padding: 4px 8px;
  cursor: pointer;
}

.principle-sheet {
  display: none;
  background: #fffaf0;
  border: 1px solid #d5c6ad;
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 11px;
  line-height: 1.45;
  max-height: 120px;
  overflow-y: auto;
  white-space: pre-wrap;
}

.principle-sheet.open {
  display: block;
}

.chat-stream {
  flex: 1;
  min-height: 90px;
  background: #fffdf9;
  border: 1px solid #dfd3bc;
  border-radius: 8px;
  padding: 12px;
  overflow-y: auto;
  font-size: 13px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.auth-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.composer-box {
  background: #fffdf9;
  border: 1px solid #cbbba0;
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.composer-label {
  font-size: 11px;
  font-weight: 800;
  color: #675845;
}

input[type="password"],
input[type="text"],
textarea {
  width: 100%;
  background: #fffaf0;
  border: 1px solid #d5c6ad;
  border-radius: 6px;
  color: #2c241b;
  font-family: inherit;
  font-size: 12px;
  padding: 7px 9px;
}

textarea#request {
  background: transparent;
  border: 0;
  padding: 2px 0;
  min-height: 46px;
  resize: none;
  font-size: 13px;
}

textarea#request:focus,
input:focus {
  outline: none;
}

.composer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 4px;
  border-top: 1px solid #efe6d6;
}

.composer-tip {
  font-size: 11px;
  color: #897965;
}

.composer-btns {
  display: flex;
  align-items: center;
  gap: 6px;
}

.ghost-btn {
  background: #f3ead8;
  border: 1px solid #cbbba0;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 700;
  color: #3a3025;
  cursor: pointer;
}

.send-btn {
  background: #e6dcc8;
  color: #3a3025;
  border: 1px solid #c5b396;
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.send-btn.ready,
.send-btn:hover {
  background: #8c5a2b;
  color: #fff;
  border-color: #8c5a2b;
}

.retry-btn {
  background: #2f6f4e;
  color: #fff;
  border: 0;
  border-radius: 6px;
  padding: 6px 11px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

/* 하단 직원 스트립 */
.roster-strip {
  height: 92px;
  background: #f6efe2;
  border-top: 1px solid #d5c6ad;
  padding: 6px 10px;
  display: flex;
  align-items: stretch;
  gap: 8px;
  overflow-x: auto;
  flex-shrink: 0;
}

.staff-card {
  min-width: 146px;
  background: #fffdf9;
  border: 1px solid #d5c6ad;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr);
  grid-template-rows: 1fr;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.staff-portrait {
  width: 38px;
  height: 58px;
  position: relative;
  overflow: hidden;
  border-radius: 7px;
  background: linear-gradient(145deg, var(--portrait-bg), #e9e3d8);
  border: 1px solid rgba(50,55,65,.16);
  align-self: center;
}
.staff-portrait .portrait-head {
  position: absolute;
  width: 17px;
  height: 20px;
  left: 10px;
  top: 8px;
  border-radius: 48% 48% 44% 44%;
  background: #e9b995;
  box-shadow: inset 0 2px 0 rgba(45,35,30,.55);
}
.staff-portrait .portrait-body {
  position: absolute;
  width: 29px;
  height: 25px;
  left: 4px;
  bottom: -3px;
  border-radius: 10px 10px 3px 3px;
  background: var(--portrait-color);
}
.staff-card-info {
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.staff-card.selected {
  border: 2px solid #8c5a2b;
  background: #fff4df;
}

.staff-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}

.staff-name {
  font-size: 12px;
  font-weight: 900;
}

.staff-state-tag {
  font-size: 9px;
  font-weight: 800;
  padding: 1px 5px;
  border-radius: 4px;
  background: #e8f5e9;
  color: #256d3b;
}

.staff-mid {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  color: #7b6c58;
}

.staff-dept {
  font-size: 10px;
  color: #5b4c3b;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.add-staff-btn {
  min-width: 72px;
  background: #fffaf0;
  border: 1px dashed #c5b396;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  color: #5b4c3b;
  cursor: pointer;
  flex-shrink: 0;
}

/* 상세 드로어 */
.detail-drawer {
  display: none;
  background: #fffaf0;
  border: 1px solid #d5c6ad;
  border-radius: 8px;
  padding: 10px 12px;
}

body.detail-open .detail-drawer {
  display: grid;
  gap: 8px;
}

.detail-box {
  background: #fffdf9;
  border: 1px solid #e3d6be;
  border-radius: 6px;
  padding: 8px 10px;
}

.detail-box h4 {
  margin: 0 0 6px;
  font-size: 13px;
}

.tool-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.history-item-btn {
  width: 100%;
  text-align: left;
  background: #fffaf0;
  border: 1px solid #dfd3bc;
  border-radius: 6px;
  padding: 6px 8px;
  margin-bottom: 5px;
  font-size: 11px;
  cursor: pointer;
}

@media (max-width: 900px) {
  html, body {
    height: auto;
    overflow: auto;
  }
  .main-grid {
    grid-template-columns: 1fr;
  }
  .office-stage {
    height: 360px;
  }
  .auth-row {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<header class="top-bar">
  <div class="top-left">
    <div class="office-title-group">
      <div class="office-title">SW AI OFFICE</div>
      <div class="office-sub">AI 본부장 업무실</div>
    </div>
  </div>
  <div class="top-right">
    <span class="info-pill" id="headerStaffCount">● 직원 0명</span>
    <span class="info-pill">● 온라인</span>
    <button type="button" class="top-btn" id="toggleDetailBtn">↗ 업무상세</button>
    <button type="button" class="top-btn" id="resetViewBtn">초기화</button>
  </div>
</header>

<main class="main-grid">
  <section class="office-stage" aria-label="AI 가상 사무실">
    <div class="active-badge" id="activeStaffBadge">● 활성 직원 0명</div>
    <canvas id="officeCanvas"></canvas>
    <div class="stage-bottom-bar">
      <div class="stage-hints">
        <span class="hint-chip">캐릭터/이름 클릭: 대화</span>
        <span class="hint-chip">드래그·터치: 화면 이동</span>
        <span class="hint-chip">휠: 확대/축소</span>
      </div>
      <div class="view-group">
        <button type="button" class="view-btn" id="view2dBtn">2D</button>
        <button type="button" class="view-btn active" id="view3dBtn">3D</button>
      </div>
    </div>
  </section>

  <section class="chat-panel" aria-label="직원 대화 및 업무 지시">
    <div class="chat-header">
      <div class="agent-wrap">
        <div class="agent-avatar" id="profileAvatar">알</div>
        <div>
          <div class="agent-title-line">
            <span class="agent-name" id="profileName">알렉스</span>
            <span class="agent-role-badge" id="profileRoleTag">관리자 / 본부장</span>
          </div>
          <div class="agent-status-line" id="profileMeta">Idle - 도와드릴 준비가 되어 있습니다</div>
        </div>
      </div>
      <button type="button" class="principle-toggle" id="togglePrincipleBtn">업무 지침 보기</button>
    </div>

    <div class="principle-sheet" id="principleBox"></div>

    <div class="chat-stream" id="response">업무 지시와 답변이 이 창에 표시됩니다. 직원을 선택하고 메시지를 입력해 주세요.</div>

    <div class="auth-row">
      <input id="officeAccessToken" type="password" autocomplete="off" placeholder="서버 접속 인증 값 입력">
      <input id="representativeAccessToken" type="password" autocomplete="off" placeholder="대표 승인 인증 값 입력">
    </div>

    <div class="composer-box">
      <div class="composer-label">메시지</div>
      <textarea id="request" placeholder="알렉스에게 메시지를 작성하십시오..."></textarea>
      <div class="composer-bottom">
        <span class="composer-tip">입력 전송 · Shift+새 줄 입력</span>
        <div class="composer-btns">
          <button id="retryTaskButton" type="button" class="retry-btn" style="display:none;">보존된 업무 재처리</button>
          <button type="button" class="ghost-btn" id="attachSampleBtn">+ 첨부</button>
          <button id="sendButton" type="button" class="send-btn">보내기 →</button>
        </div>
      </div>
    </div>

    <div class="detail-drawer" id="detailDrawer">
      <div class="detail-box" id="deliverableCard" style="display:none;">
        <div class="tool-row">
          <button id="copyDeliverable" type="button" class="ghost-btn">전체 복사</button>
          <button id="downloadWord" type="button" class="ghost-btn">Word 다운로드</button>
          <button id="downloadPdf" type="button" class="ghost-btn">PDF 다운로드</button>
        </div>
        <div id="deliverableContent"></div>
      </div>

      <div class="detail-box">
        <h4>최근 업무 기록</h4>
        <div id="taskHistoryList">저장된 업무 기록이 없습니다.</div>
      </div>

      <div class="detail-box">
        <h4>서버 업무 이력 조회</h4>
        <div class="auth-row">
          <input id="serverHistoryTaskId" type="text" autocomplete="off" placeholder="조회할 업무 ID 입력">
          <button id="loadServerHistoryButton" type="button" class="ghost-btn">서버 이력 조회</button>
        </div>
        <p id="serverHistoryStatus" class="agent-status-line" aria-live="polite">업무 ID를 입력해 이력을 조회하세요.</p>
        <ol id="serverHistoryEvents" class="agent-status-line"></ol>
      </div>
    </div>
  </section>
</main>

<footer class="roster-strip" id="rosterStrip" aria-label="직원 카드 목록"></footer>

<script type="module">
let employeeDirectory = [];
try {
  const mod = await import('./employees.js');
  if (Array.isArray(mod.default) && mod.default.length) {
    employeeDirectory = mod.default;
  }
} catch (_) {}

if (!employeeDirectory.length) {
  employeeDirectory = [
    { id: 'COO', name: '알렉스', department: '본부장실 · 본부장', position: '관리자', instruction: '업무 분석, 담당 팀과 직원 배정, 진행 총괄 및 최종 보고를 담당한다.' },
    { id: 'CEO', name: '피터', department: '대표이사실 · 대표이사', position: '임원', instruction: '최종 의사결정 및 승인을 담당한다.' },
    { id: 'DEV_1', name: '유진', department: 'IT 및 소프트웨어 개발', position: '시니어', instruction: '시스템 개발 및 기술 검토를 담당한다.' },
    { id: 'OPS_1', name: '에이든', department: '관리 및 운영', position: '매니저', instruction: '운영 총괄 및 일정 조율을 담당한다.' },
    { id: 'LEG_1', name: '단테', department: '법무 및 컴플라이언스', position: '리드', instruction: '계약 검토 및 법적 리스크 점검을 담당한다.' },
    { id: 'FIN_1', name: '제니', department: '재무 및 회계', position: '매니저', instruction: '예산 검토 및 정산 관리를 담당한다.' },
    { id: 'DEV_2', name: '민준', department: 'IT 및 소프트웨어 개발', position: '담당', instruction: '데이터 파이프라인 및 자동화를 담당한다.' },
    { id: 'DEV_3', name: '해나', department: 'IT 및 소프트웨어 개발', position: '담당', instruction: '인터페이스 및 화면 구성을 담당한다.' },
    { id: 'MKT_1', name: '로라', department: '브랜드 및 커뮤니케이션', position: '매니저', instruction: '대외 메시지 및 홍보 자료를 담당한다.' },
    { id: 'SLS_1', name: '브라이언', department: '사업개발 및 영업', position: '매니저', instruction: '제휴 및 거래선 협의를 담당한다.' },
    { id: 'OPS_2', name: '클로이', department: '관리 및 운영', position: '담당', instruction: '문서 관리 및 행정 지원을 담당한다.' },

function project(x, y, z) {
  const cx = officeCanvas.width * 0.5 + panX;
  const cy = officeCanvas.height * 0.53 + panY;
  if (view2D) {
    return {
      x: cx + x * zoom * 0.86,
      y: cy + z * zoom * 0.86 - y * zoom * 0.35
    };
  }
  const cyaw = Math.cos(yaw), syaw = Math.sin(yaw);
  const x1 = x * cyaw - z * syaw;
  const z1 = x * syaw + z * cyaw;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const y2 = y * cp - z1 * sp;
  const z2 = y * sp + z1 * cp;
  const isoX = (x1 - z2) * 0.866;
  const isoY = (x1 + z2) * 0.45 - y2;
  return {
    x: cx + isoX * zoom * 0.66,
    y: cy + isoY * zoom * 0.66
  };
}

function drawQuad(pts, fill, stroke = '#8f7e67', lw = 1) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw;
    ctx.stroke();
  }
}

function drawBox3D(x, y, z, w, h, d, cTop, cLeft, cRight) {
  const p001 = project(x - w / 2, y, z + d / 2);
  const p100 = project(x + w / 2, y, z - d / 2);
  const p101 = project(x + w / 2, y, z + d / 2);
  const p010 = project(x - w / 2, y + h, z - d / 2);
  const p110 = project(x + w / 2, y + h, z - d / 2);
  const p111 = project(x + w / 2, y + h, z + d / 2);
  const p011 = project(x - w / 2, y + h, z + d / 2);

  drawQuad([p010, p110, p111, p011], cTop, '#7a6952', 0.8);
  drawQuad([p001, p101, p111, p011], cLeft, '#7a6952', 0.8);
  drawQuad([p100, p101, p111, p110], cRight, '#7a6952', 0.8);
}

function renderScene(nowSec) {
  canvasHits.length = 0;
  ctx.clearRect(0, 0, officeCanvas.width, officeCanvas.height);

  drawQuad([
    project(-8.0, 0, -5.0),
    project(8.0, 0, -5.0),
    project(8.0, 0, 5.2),
    project(-8.0, 0, 5.2)
  ], '#f7f1e5', '#b5a387', 2);

  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ZONES.forEach(z => {
    drawQuad([
      project(z.x1, 0.01, z.z1),
      project(z.x2, 0.01, z.z1),
      project(z.x2, 0.01, z.z2),
      project(z.x1, 0.01, z.z2)
    ], z.color, '#c8b79c', 1.2);
    const pt = project((z.x1 + z.x2) / 2, 0.03, z.z1 + 0.35);
    ctx.fillStyle = '#756450';
    ctx.fillText(z.name, pt.x, pt.y);
  });

  // 각 업무 책상 뒤에 의자와 등받이를 배치해 실제 근무석 형태로 구성
  WORKSTATIONS.forEach(ws => {
    drawBox3D(ws.x, 0, ws.z + 0.62, 0.42, 0.16, 0.38, '#596779', '#3e4a5b', '#2d3748');
    drawBox3D(ws.x, 0.16, ws.z + 0.78, 0.42, 0.48, 0.12, '#68788b', '#4b5b70', '#354256');
  });

  WORKSTATIONS.forEach(ws => {
    drawBox3D(ws.x, 0, ws.z, 1.15, 0.42, 0.55, '#e8d8bc', '#cbb796', '#b39e7c');
    drawBox3D(ws.x, 0.42, ws.z - 0.06, 0.48, 0.3, 0.08, '#4a5568', '#2d3748', '#1a202c');
  });

  // 메인 회의실: 회의 테이블과 6석
  drawBox3D(-4.2, 0, 2.7, 2.2, 0.4, 1.1, '#dfc9a6', '#c5ad88', '#a8906c');
  [
    [-5.55, 2.1], [-5.55, 3.25], [-4.2, 1.9],
    [-2.85, 2.1], [-2.85, 3.25], [-4.2, 3.55]
  ].forEach(([x, z]) => {
    drawBox3D(x, 0, z, 0.42, 0.18, 0.42, '#596779', '#3e4a5b', '#2d3748');
    drawBox3D(x, 0.18, z, 0.42, 0.52, 0.12, '#68788b', '#4b5b70', '#354256');
  });

  SERVER_RACKS.forEach(sr => {
    drawBox3D(sr.x, 0, sr.z, 0.65, 1.15, 0.55, '#475569', '#334155', '#1e293b');
  });

  const sorted = [...actors].sort((a, b) => (a.x + a.z) - (b.x + b.z));
  sorted.forEach(ac => {
    const isSel = selectedEmployee && String(selectedEmployee.id) === String(ac.emp.id);
    const walkBob = Math.abs(Math.sin(nowSec * 6 + ac.phase)) * 0.09;
    const armSwing = Math.sin(nowSec * 6.5 + ac.phase) * 0.15;

    // 입체 박스 캐릭터 대신 얼굴·몸통·팔·다리가 구분되는 사람형 아바타
    const foot = project(ac.x, walkBob, ac.z);
    const head = project(ac.x, walkBob + 0.88, ac.z);
    const shoulder = project(ac.x, walkBob + 0.58, ac.z);
    const leftArm = project(ac.x - 0.23 + armSwing * 0.18, walkBob + 0.48, ac.z);
    const rightArm = project(ac.x + 0.23 - armSwing * 0.18, walkBob + 0.48, ac.z);
    const leftFoot = project(ac.x - 0.11, walkBob + 0.04, ac.z);
    const rightFoot = project(ac.x + 0.11, walkBob + 0.04, ac.z);
    const scale = Math.max(0.62, Math.min(1.25, zoom / 41));
    const bodyW = 12 * scale;
    const bodyH = 19 * scale;
    const headR = 7.2 * scale;

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // 다리와 신발
    ctx.strokeStyle = '#273449';
    ctx.lineWidth = 4.2 * scale;
    ctx.beginPath();
    ctx.moveTo(shoulder.x - 3 * scale, shoulder.y + bodyH * 0.55);
    ctx.lineTo(leftFoot.x, leftFoot.y - 1 * scale);
    ctx.moveTo(shoulder.x + 3 * scale, shoulder.y + bodyH * 0.55);
    ctx.lineTo(rightFoot.x, rightFoot.y - 1 * scale);
    ctx.stroke();
    // 팔
    ctx.strokeStyle = '#e7b995';
    ctx.lineWidth = 4.5 * scale;
    ctx.beginPath();
    ctx.moveTo(shoulder.x - bodyW * 0.72, shoulder.y + 2 * scale);
    ctx.lineTo(leftArm.x, leftArm.y);
    ctx.moveTo(shoulder.x + bodyW * 0.72, shoulder.y + 2 * scale);
    ctx.lineTo(rightArm.x, rightArm.y);
    ctx.stroke();
    // 상체
    ctx.fillStyle = ac.color;
    ctx.strokeStyle = 'rgba(20,28,40,.55)';
    ctx.lineWidth = 1 * scale;
    ctx.beginPath();
    ctx.roundRect(shoulder.x - bodyW / 2, shoulder.y, bodyW, bodyH, 4 * scale);
    ctx.fill();
    ctx.stroke();
    // 목과 얼굴
    ctx.fillStyle = ac.skin;
    ctx.fillRect(head.x - 2.5 * scale, head.y + headR * 0.55, 5 * scale, 5 * scale);
    ctx.beginPath();
    ctx.arc(head.x, head.y, headR, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#9b6b50';
    ctx.lineWidth = 0.8 * scale;
    ctx.stroke();
    // 헤어 실루엣과 눈
    ctx.fillStyle = ac.hair;
    const hairLift = ac.hairStyle === 2 ? 3.2 : ac.hairStyle === 3 ? 0.2 : 1.7;
    const hairWidth = ac.hairStyle === 1 ? 1.12 : ac.hairStyle === 3 ? 1.06 : 0.98;
    ctx.beginPath();
    ctx.arc(head.x, head.y - hairLift * scale, headR * hairWidth, Math.PI, Math.PI * 2);
    ctx.lineTo(head.x + headR * (ac.hairStyle === 1 ? 1.0 : 0.82), head.y + (ac.hairStyle === 3 ? 3 : -headR * 0.1));
    ctx.quadraticCurveTo(head.x, head.y - headR * (ac.hairStyle === 2 ? 1.25 : 0.8), head.x - headR * (ac.hairStyle === 1 ? 1.0 : 0.9), head.y);
    if (ac.hairStyle === 1 || ac.hairStyle === 3) {
      ctx.lineTo(head.x - headR * 0.82, head.y + headR * 0.75);
      ctx.quadraticCurveTo(head.x, head.y + headR * 0.2, head.x + headR * 0.82, head.y + headR * 0.75);
    }
    ctx.fill();
    ctx.fillStyle = '#342c28';
    ctx.beginPath();
    ctx.arc(head.x - 2.5 * scale, head.y + 1.1 * scale, 0.8 * scale, 0, Math.PI * 2);
    ctx.arc(head.x + 2.5 * scale, head.y + 1.1 * scale, 0.8 * scale, 0, Math.PI * 2);
    ctx.fill();
    // 선택된 직원 표시
    if (isSel) {
      ctx.strokeStyle = '#f0b429';
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.ellipse(foot.x, foot.y + 2 * scale, 13 * scale, 5 * scale, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    const topPt = project(ac.x, walkBob + 1.12, ac.z);
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    const label = ac.emp.name;
    const w = ctx.measureText(label).width + 10;
    const bx = topPt.x - w / 2;
    const by = topPt.y - 16;

    ctx.fillStyle = isSel ? '#8c5a2b' : '#fffaf0';
    ctx.strokeStyle = isSel ? '#4d2e11' : '#8d7b63';
    ctx.lineWidth = isSel ? 2 : 1;
    ctx.beginPath();
    ctx.roundRect(bx, by, w, 17, 4);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = isSel ? '#fff' : '#2c241b';
    ctx.fillText(label, topPt.x, topPt.y - 4);

    canvasHits.push({
      emp: ac.emp,
      x: bx,
      y: by,
      w,
      h: 17,
      cx: topPt.x,
      cy: topPt.y + 12,
      r: 18
    });
  });
}

function updateActors(dt) {
  actors.forEach((ac, idx) => {
    if (ac.pauseTimer > 0) {
      ac.pauseTimer -= dt;
      return;
    }
    const dx = ac.targetX - ac.x;
    const dz = ac.targetZ - ac.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.08) {
      ac.pauseTimer = 1.0 + (idx % 3) * 0.65;
      const nextWp = WAYPOINTS[(Math.floor(Math.random() * WAYPOINTS.length) + idx) % WAYPOINTS.length];
      ac.targetX = nextWp.x;
      ac.targetZ = nextWp.z;
    } else {
      const step = Math.min(dist, ac.speed * dt);
      ac.x += (dx / dist) * step;
      ac.z += (dz / dist) * step;
    }
  });
}

let lastFrameTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
  lastFrameTime = now;
  updateActors(dt);
  renderScene(now / 1000);
  requestAnimationFrame(loop);
}

function resizeOfficeCanvas() {
  const parent = officeCanvas.parentElement;
  if (!parent) return;
  officeCanvas.width = Math.max(280, parent.clientWidth);
  officeCanvas.height = Math.max(240, parent.clientHeight);
}

officeCanvas.addEventListener('contextmenu', e => e.preventDefault());

// 마우스 드래그·터치 이동 및 두 손가락 확대/축소
const activePointers = new Map();
let pointerStartX = 0;
let pointerStartY = 0;
let pointerMoved = false;
let pinchDistance = 0;

function distanceBetweenPointers() {
  const pts = [...activePointers.values()];
  if (pts.length < 2) return 0;
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}

officeCanvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  officeCanvas.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
  pointerMoved = false;
  lastX = e.clientX;
  lastY = e.clientY;
  dragging = true;
  panning = true;
  if (activePointers.size === 2) pinchDistance = distanceBetweenPointers();
});

officeCanvas.addEventListener('pointermove', e => {
  if (!activePointers.has(e.pointerId)) return;
  e.preventDefault();
  const previous = activePointers.get(e.pointerId);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size >= 2) {
    const nextDistance = distanceBetweenPointers();
    if (pinchDistance > 0 && nextDistance > 0) {
      zoom = Math.max(24, Math.min(95, zoom * (nextDistance / pinchDistance)));
    }
    pinchDistance = nextDistance;
    pointerMoved = true;
  } else {
    const dx = e.clientX - previous.x;
    const dy = e.clientY - previous.y;
    if (Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY) > 4) pointerMoved = true;
    panX += dx;
    panY += dy;
  }
});

function finishPointer(e) {
  if (!activePointers.has(e.pointerId)) return;
  if (activePointers.size === 1 && !pointerMoved) {
    const rect = officeCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const hit = canvasHits.find(h =>
      (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) ||
      Math.hypot(mx - h.cx, my - h.cy) <= h.r
    );
    if (hit) {
      selectedEmployee = hit.emp;
      renderRightPanelEmployee();
      renderRosterStrip();
    }
  }
  activePointers.delete(e.pointerId);
  pinchDistance = activePointers.size === 2 ? distanceBetweenPointers() : 0;
  if (activePointers.size === 0) {
    dragging = false;
    panning = false;
    pointerMoved = false;
  }
}

officeCanvas.addEventListener('pointerup', finishPointer);
officeCanvas.addEventListener('pointercancel', finishPointer);

  zoom = Math.max(24, Math.min(95, zoom - e.deltaY * 0.035));

function normalizeEmployeeStatus(value, stage) {
  const raw = String(value || stage || '').toLowerCase();
  if (/보완 필요|revision required|needs revision/.test(raw)) return '보완 필요';
  if (/검수|review|inspect|qa/.test(raw)) return '검수 중';
  if (/협업|collab|coordinate|meeting/.test(raw)) return '협업 중';
  if (/휴식|break/.test(raw)) return '휴식 중';
  if (/완료|complete|done|approved/.test(raw)) return '완료';
  if (/승인|대기|pending|idle/.test(raw)) return '유휴';
  return '업무 중';
}

function syncEmployeeStates(data, taskId) {
  if (!data || typeof data !== 'object') return;
  let states = {};
  try {
    states = JSON.parse(localStorage.getItem(EMPLOYEE_STATE_KEY) || '{}');
  } catch (_) {}

  const stage = data.currentStage || data.workflow?.currentStage || '업무 처리';
  const now = new Date().toISOString();
  const visited = new Set();

  function applyEmployee(employee, value) {
    if (!employee) return;
    const rawStatus = value.status ?? value.state ?? value.currentStatus ?? stage;
    const detail = value.detail ?? value.description ?? value.task ?? stage;
    states[employee.id] = {
      status: normalizeEmployeeStatus(rawStatus, stage),
      detail: String(detail).slice(0, 500),
      taskId,
      updatedAt: now
    };
  }

  function walk(value, depth = 0) {
    if (!value || typeof value !== 'object' || depth > 9 || visited.has(value)) return;
    visited.add(value);
    if (Array.isArray(value)) {
      value.forEach(item => walk(item, depth + 1));
      return;
    }
    const id = value.employeeId ?? value.assigneeId ?? value.staffId ??
      (employeeById.has(String(value.id ?? '')) ? value.id : null);
    const name = value.employeeName ?? value.assigneeName ?? value.staffName ??
      (typeof value.employee === 'string' ? value.employee : null);
    const emp = (id != null && employeeById.get(String(id))) ||
      (name && employeeByName.get(String(name)));
    applyEmployee(emp, value);
    Object.values(value).forEach(child => walk(child, depth + 1));
  }

  walk(data);
  states.COO = {
    status: data.status === 'WAITING_FOR_API_QUOTA' ? '유휴' : (data.reply && data.workflow ? '완료' : '업무 중'),
    detail: String(stage).slice(0, 500),
    taskId,
    updatedAt: now
  };
  localStorage.setItem(EMPLOYEE_STATE_KEY, JSON.stringify(states));
  renderRosterStrip();
}

function saveTaskHistory(task, taskId, reply, deliverables, workflow, finalReviewResults) {
  const history = loadTaskHistory();
  const record = {
    taskId,
    task,
    reply,
    deliverables,
    workflow: workflow || {},
    finalReviewResults: finalReviewResults || [],
    savedAt: new Date().toISOString()
  };
  const updated = [record, ...history.filter(item => item.taskId !== taskId)].slice(0, TASK_HISTORY_LIMIT);
  localStorage.setItem(TASK_HISTORY_KEY, JSON.stringify(updated));
}

function renderMarkdown(text) {
  const escaped = String(text || '')
    .replace(/&/g, '&')
    .replace(/</g, '<')
    .replace(/>/g, '>');
  return escaped
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>')
    .replace(/^# (.*)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

async function sendTask(reusePending = false) {
  let pending = null;
  if (reusePending) {
    try {
      pending = JSON.parse(localStorage.getItem(PENDING_TASK_KEY) || 'null');
    } catch (_) {}
  }

  const taskId = pending?.taskId || crypto.randomUUID();
  const idempotencyKey = pending?.idempotencyKey || taskId;
  let quotaRetryCount = Math.max(0, Number(pending?.quotaRetryCount) || 0);
  let modelUnavailableRetryCount = Math.max(0, Number(pending?.modelUnavailableRetryCount) || 0);
  let timeoutRetryCount = Math.max(0, Number(pending?.timeoutRetryCount) || 0);

  const accessToken = accessTokenBox.value.trim();
  if (!accessToken) {
    responseBox.textContent = '서버 접속 인증 값을 입력해 주세요.';
    return;
  }
  if (isTaskRunning) {
    responseBox.textContent = '이미 업무를 처리하고 있습니다.';
    return;
  }

  const task = (reusePending && pending?.task) ? pending.task : requestBox.value.trim();
  const employeesForTask = (reusePending && Array.isArray(pending?.employees)) ? pending.employees : employeeDirectory;

  if (!task) {
    alert('업무지시를 입력하세요.');
    return;
  }

  isTaskRunning = true;
  sendButton.disabled = true;
  retryTaskButton.disabled = true;
  responseBox.textContent = '업무 접수 및 팀 배정 준비 중...';

  try {
    localStorage.setItem(
      PENDING_TASK_KEY,
      JSON.stringify({
        task,
        taskId,
        idempotencyKey,
        status: 'WAITING_FOR_PROCESSING',
        quotaRetryCount,
        modelUnavailableRetryCount,
        timeoutRetryCount,
        employees: employeesForTask,
        savedAt: new Date().toISOString()
      })
    );

    let data = null;
    let completedResponse = false;
    const MAX_QUOTA_RETRIES = 48;

    for (let step = 1; step <= 1000; step++) {
      const response = await fetch('https://ai-office-api.creditor5120.workers.dev/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + accessToken
        },
        body: JSON.stringify({
          task,
          taskId,
          idempotencyKey,
          employee: headOfOffice.name,
          employeeId: headOfOffice.id,
          department: headOfOffice.department || '본부장실',
          position: headOfOffice.position || '본부장',
          instruction: headOfOffice.instruction || '',
          employees: employeesForTask
        })
      });

      const raw = await response.text();
      try {
        data = JSON.parse(raw);
      } catch (_) {
        data = { error: raw || '서버 응답을 해석할 수 없습니다.' };
      }

      syncEmployeeStates(data, taskId);

      if (response.ok && data.reply && data.workflow) {
        completedResponse = true;
        break;
      }

      if (response.status === 202 && data.status === 'PROCESSING') {
        const resumeDelayMs = Math.max(1200, Number(data.resumeDelayMs) || 1200);
        const savedForRetry = JSON.parse(localStorage.getItem(PENDING_TASK_KEY) || 'null') || {};

        if (data.modelUnavailableResumable || data.timeoutResumable) {
          const retryType = data.modelUnavailableResumable ? 'modelUnavailable' : 'timeout';
          const retryLimit = retryType === 'modelUnavailable' ? 5 : 10;
          const retryCountKey = retryType === 'modelUnavailable'
            ? 'modelUnavailableRetryCount'
            : 'timeoutRetryCount';
          const retryCount = retryType === 'modelUnavailable'
            ? ++modelUnavailableRetryCount
            : ++timeoutRetryCount;

          savedForRetry[retryCountKey] = retryCount;
          savedForRetry.updatedAt = new Date().toISOString();
          localStorage.setItem(PENDING_TASK_KEY, JSON.stringify(savedForRetry));

          if (retryCount >= retryLimit) {
            responseBox.textContent =
              `Gemini ${retryType === 'modelUnavailable' ? '서버 과부하' : '응답 시간 초과'}가 ${retryCount}회 반복되어 자동 재시도를 중단했습니다.\n` +
              '업무와 체크포인트는 보존되어 있습니다.\n' +
              '보존된 업무 재처리를 이용해 주세요.';
            retryTaskButton.style.display = 'inline-block';
            return;
          }

          responseBox.textContent =
            `Gemini ${retryType === 'modelUnavailable' ? '서버 과부하' : '응답 시간 초과'}로 보존 중 (${retryCount}/${retryLimit}) · ${Math.ceil(resumeDelayMs / 1000)}초 후 재시도`;
        } else {
          responseBox.textContent = `업무 처리 중 (${step}/1000) · 현재 단계: ${data.currentStage || '확인 중'}`;
        }

        await sleep(resumeDelayMs);
        continue;
      }

      if (response.status === 409 && data.status === 'PROCESSING') {
        responseBox.textContent = `기존 실행 대기 중 (${step}/1000)`;
        await sleep(2500);
        continue;
      }

      if (data.status === 'WAITING_FOR_API_QUOTA') {
        quotaRetryCount++;
        const quotaWaitMs = Number(data.quotaRetryAfterMs) > 0 ? Number(data.quotaRetryAfterMs) : 300000;
        const quotaPending = JSON.parse(localStorage.getItem(PENDING_TASK_KEY) || 'null');
        if (quotaPending && quotaPending.taskId === taskId) {
          quotaPending.quotaRetryCount = quotaRetryCount;
          quotaPending.status = 'WAITING_FOR_API_QUOTA';
          quotaPending.nextRetryAt = new Date(Date.now() + quotaWaitMs).toISOString();
          localStorage.setItem(PENDING_TASK_KEY, JSON.stringify(quotaPending));
        }
        if (quotaRetryCount <= MAX_QUOTA_RETRIES) {
          responseBox.textContent = `AI API 사용 한도 대기 중 (${quotaRetryCount}/${MAX_QUOTA_RETRIES}) · 약 ${Math.ceil(quotaWaitMs / 60000)}분 후 자동 재시도`;
          await sleep(quotaWaitMs);
          continue;
        }
      }

      throw new Error(data.error || '서버 연결 오류');
    }

    if (!completedResponse) {
      throw new Error('1000회 처리 단위에 도달했습니다. 보존된 업무 재처리를 눌러 이어서 진행하세요.');
    }

    const fullReply = data.reply || '응답 내용이 없습니다.';
    responseBox.innerHTML = renderMarkdown(fullReply);
    renderWorkflowReview({ taskId, workflow: data.workflow, finalReviewResults: data.finalReviewResults || [] });

    const deliverables = Array.isArray(data.deliverables) ? data.deliverables : [];
    const deliverableText = deliverables.map((item, i) => `# ${item.title || `결과물 ${i + 1}`}\n\n${item.content || ''}`).join('\n\n---\n\n');
    const delivCard = document.getElementById('deliverableCard');
    const delivContent = document.getElementById('deliverableContent');
    if (deliverableText.trim()) {
      delivCard.style.display = 'block';
      delivContent.innerHTML = renderMarkdown(deliverableText);
      document.getElementById('copyDeliverable').onclick = async () => {
        await navigator.clipboard.writeText(deliverableText);
      };
    }

    saveTaskHistory(task, taskId, fullReply, deliverables, data.workflow, data.finalReviewResults);
    renderTaskHistory();
    localStorage.removeItem(PENDING_TASK_KEY);
    retryTaskButton.style.display = 'none';
  } catch (err) {
    responseBox.textContent = '오류가 발생했어: ' + err.message;
    const saved = localStorage.getItem(PENDING_TASK_KEY);
    if (saved) retryTaskButton.style.display = 'inline-block';
  } finally {
    isTaskRunning = false;
    sendButton.disabled = false;
    retryTaskButton.disabled = false;
  }
}

renderTaskHistory();
sendButton.addEventListener('click', () => sendTask(false));

retryTaskButton.addEventListener('click', () => {
  const savedTask = JSON.parse(localStorage.getItem(PENDING_TASK_KEY) || 'null');
  if (!savedTask || !savedTask.task) {
    responseBox.textContent = '재처리할 업무가 없습니다.';
    retryTaskButton.style.display = 'none';
    return;
  }
  savedTask.modelUnavailableRetryCount = 0;
  savedTask.timeoutRetryCount = 0;
  savedTask.updatedAt = new Date().toISOString();
  localStorage.setItem(PENDING_TASK_KEY, JSON.stringify(savedTask));
  requestBox.value = savedTask.task;
  updateSendButtonState();
  sendTask(true);
});
</script>
