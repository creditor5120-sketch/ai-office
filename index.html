
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY AI OFFICE</title>

<style>
body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

h1 {
  color: #60a5fa;
}

.card {
  background: #243247;
  padding: 20px;
  margin: 12px 0;
  border-radius: 12px;
}

button {
  background: #2563eb;
  color: white;
  border: 0;
  padding: 13px;
  border-radius: 8px;
  width: 100%;
  margin-top: 10px;
  box-sizing: border-box;
  cursor: pointer;
}

button:disabled {
  background: #64748b;
  cursor: wait;
}

textarea {
  width: 100%;
  height: 150px;
  box-sizing: border-box;
  padding: 12px;
  border-radius: 8px;
  font: inherit;
}

#response {
  white-space: pre-wrap;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

#response h1,
#response h2,
#response h3 {
  color: #93c5fd;
}

#response hr {
  border: 0;
  border-top: 1px solid #64748b;
  margin: 18px 0;
}

.small {
  color: #cbd5e1;
  font-size: 14px;
}

.role {
  color: #93c5fd;
  font-size: 15px;
}
</style>
</head>

<body>

<h1>MY AI OFFICE</h1>
<p>나만의 AI 업무실</p>

<div class="card">
  <h2>AI 본부장 업무실</h2>

  <p class="role">
    COO · 조직 운영 및 업무 실행 총괄
  </p>

  <p class="small">
    모든 업무는 본부장에게 지시해.
    본부장은 업무를 분석하고 담당 부서와 전문 직원을 배정해.
    부서 간 협업과 진행 상황을 관리하고 결과물을 검수한 후 사용자에게 보고해.
  </p>

  <textarea
    id="request"
    placeholder="본부장에게 업무를 지시해."
  ></textarea>

  <button id="sendButton">
    본부장에게 업무 지시
  </button>
</div>

<div class="card">
  <h3>업무 처리 결과</h3>
  <p id="response">아직 접수된 업무가 없어.</p>
</div>

<script type="module">

import employeeDirectory from './employees.js';

// 기존 CEO 내부 ID는 직원 데이터 연결을 위해 유지
// 화면과 업무상 역할은 본부장으로 변경
const headOfOffice = employeeDirectory.find(
  item => item.id === 'CEO'
);

const responseBox = document.getElementById('response');
const sendButton = document.getElementById('sendButton');
const requestBox = document.getElementById('request');

// Markdown 출력 처리
function renderMarkdown(text) {

  const escaped = String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // AI 응답의 Markdown 앞에 붙은 불필요한 역슬래시 제거
  const normalized = escaped.replace(
    /\\(?=(?:#{1,6}\s|\*\*|__|[-*]\s|---))/g,
    ''
  );

  return normalized
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>')
    .replace(/^# (.*)$/gm, '<h1>$1</h1>')
    .replace(/^---$/gm, '<hr>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

// 업무 지시
async function sendTask() {

  const task = requestBox.value.trim();

  if (!task) {
    alert('업무 지시 내용을 입력해.');
    return;
  }

  if (!headOfOffice) {
    responseBox.textContent =
      '본부장 정보를 찾을 수 없어. 직원 데이터 설정을 확인해야 해.';
    return;
  }

  sendButton.disabled = true;
  sendButton.textContent = '본부장이 업무를 분석하고 있어...';

  responseBox.textContent =
    '업무 접수 및 부서 배분 준비 중...';

  try {

    const response = await fetch(
      'https://ai-office-api.creditor5120.workers.dev/',
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({

          task,

          employee: headOfOffice.name,
          employeeId: headOfOffice.id,

          department: '본부장실',
          position: '본부장',

          instruction:
            '너는 MY AI OFFICE의 본부장이다. ' +
            '사용자가 최종 의사결정권자이며 너는 대표이사가 아니다. ' +
            '사용자의 업무 지시를 직접 분석하고 담당 부서와 전문 직원을 배정한다. ' +
            '부서 간 협업, 우선순위, 일정, 진행 상황을 관리하고 결과물을 통합 검수한다. ' +
            '중요한 의사결정과 외부 실행은 사용자 승인을 받아야 한다. ' +
            '실제로 수행하지 않은 업무를 완료했다고 보고하지 않는다. ' +
            '실제 근거와 결과물이 없는 경우 미완료 또는 추가 확인 필요로 표시한다. ' +
            (headOfOffice.instruction || ''),

          employees: employeeDirectory

        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || '서버 연결 오류'
      );
    }

    responseBox.innerHTML = renderMarkdown(
      data.reply || '응답 내용이 없어.'
    );

  } catch (error) {

    responseBox.textContent =
      '오류가 발생했어: ' + error.message;

  } finally {

    sendButton.disabled = false;
    sendButton.textContent = '본부장에게 업무 지시';

  }
}

sendButton.addEventListener('click', sendTask);

</script>

</body>
</html>
