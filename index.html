
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY AI OFFICE</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;padding:20px}
h1{color:#60a5fa}
.card{background:#243247;padding:20px;margin:12px 0;border-radius:12px}
button,select{background:#2563eb;color:white;border:0;padding:13px;border-radius:8px;width:100%;margin-top:10px;box-sizing:border-box}
select{background:#334155}
option{background:#243247;color:white}
textarea{width:100%;height:120px;box-sizing:border-box;padding:12px;border-radius:8px;font:inherit}
#workspace{display:none}
#response{white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}
.small{color:#cbd5e1;font-size:14px}
</style>
</head>
<body>

<h1>MY AI OFFICE</h1>
<p>나만의 AI 업무실</p>

<div class="card">
<h2>AI 직원 선택</h2>
<p class="small">부서와 담당 업무에 맞는 직원을 선택해.</p>
<select id="employeeSelect">
<option value="">직원을 선택해</option>
</select>
<button id="enterButton">업무실 입장</button>
</div>

<div id="workspace" class="card">
<h2 id="employee"></h2>
<p id="employeeRole" class="small"></p>
<p>업무 지시 내용을 입력해.</p>
<textarea id="request" placeholder="업무 내용을 입력해."></textarea>
<button id="sendButton">업무 지시하기</button>
<p id="response"></p>
<button id="closeButton">오피스 나가기</button>
</div>

<script type="module">
import employeeDirectory from './employees.js';

const employeeSelect = document.getElementById('employeeSelect');
const workspace = document.getElementById('workspace');
const responseBox = document.getElementById('response');
const sendButton = document.getElementById('sendButton');

let activeEmployee = null;

// 부서별 직원 목록 구성
const departmentOrder = [
  '경영진','경영관리','법무','IR','총무','전략기획','기술·IT'
];

for (const department of departmentOrder) {
  const group = document.createElement('optgroup');
  group.label = department;

  for (const employee of employeeDirectory.filter(
    item => item.department === department
  )) {
    const option = document.createElement('option');
    option.value = employee.id;
    option.textContent = employee.name + ' · ' + employee.position;
    group.appendChild(option);
  }

  if (group.children.length) {
    employeeSelect.appendChild(group);
  }
}

// 업무실 입장
document.getElementById('enterButton').addEventListener('click', () => {
  activeEmployee = employeeDirectory.find(
    item => item.id === employeeSelect.value
  );

  if (!activeEmployee) {
    alert('먼저 AI 직원을 선택해.');
    return;
  }

  document.getElementById('employee').textContent =
    activeEmployee.name;

  document.getElementById('employeeRole').textContent =
    activeEmployee.department + ' / ' + activeEmployee.position;

  responseBox.textContent = '';
  workspace.style.display = 'block';
  workspace.scrollIntoView({behavior:'smooth'});
});

// 업무 지시
sendButton.addEventListener('click', sendTask);

async function sendTask() {
  const task = document.getElementById('request').value.trim();

  if (!activeEmployee) {
    alert('먼저 AI 직원을 선택해.');
    return;
  }

  if (!task) {
    alert('업무 내용을 입력해.');
    return;
  }

  sendButton.disabled = true;
  sendButton.textContent = '처리 중...';
  responseBox.textContent = 'AI가 업무를 처리하고 있어...';

  try {
    const response = await fetch(
      'https://ai-office-api.creditor5120.workers.dev/',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          task: task,
          employee: activeEmployee.name,
          employeeId: activeEmployee.id,
          department: activeEmployee.department,
          position: activeEmployee.position,
          instruction: activeEmployee.instruction
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || '서버 연결 오류');
    }

    responseBox.textContent = data.reply || '응답 내용이 없어.';

  } catch (error) {
    responseBox.textContent =
      '오류가 발생했어: ' + error.message;
  } finally {
    sendButton.disabled = false;
    sendButton.textContent = '업무 지시하기';
  }
}

// 오피스 나가기
document.getElementById('closeButton').addEventListener('click', () => {
  workspace.style.display = 'none';
  activeEmployee = null;
});
</script>

</body>
</html>
